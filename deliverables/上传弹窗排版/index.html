<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>上传病例 · 排版预览</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#22283b;background:#9b9daa;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px 12px}
    .sheet{width:100%;max-width:416px;background:#fff;border-radius:24px;padding:24px 24px 12px;box-shadow:0 16px 48px #252a431a}
    .upload-zone{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;border:1.5px dashed #c3bce8;border-radius:16px;background:#f2f5fc;padding:28px 16px 26px;text-align:center}
    .upload-icon{display:block;width:58px;height:50px;flex-shrink:0;margin-bottom:16px;background:url("upload-reference.png") -221px -81px / 499px 458px no-repeat}
    h1{font-size:20px;line-height:1.4;font-weight:650;margin:0;letter-spacing:0}
    .subtitle{margin:18px 0 8px;color:#b7acd5;font-family:"Microsoft YaHei",sans-serif;font-size:10px;font-weight:400;line-height:16px;letter-spacing:0;text-align:center}
    .limit{font-size:14px;line-height:1.75;color:#656d81;margin:12px 0 0;text-align:center;overflow-wrap:break-word}
    .generate{display:grid;place-items:center;width:100%;height:50px;border-radius:12px;background:#eef0f6;color:#9da5b6;font-family:inherit;line-height:1.5;border:0;font-size:16px;font-weight:600;cursor:not-allowed}
    .cancel{display:grid;place-items:center;height:44px;margin-top:8px;font-size:15px;line-height:1.5;color:#71798d}
    @media(max-width:360px){body{padding:16px 10px}.sheet{padding:20px 20px 10px;border-radius:22px}.upload-zone{min-height:186px;padding:24px 12px}}
  </style>
</head>
<body>
  <!-- Static single-screen visual review only. No uploading or generation is implemented here. -->
  <main class="sheet" aria-label="上传病例弹窗排版预览">
    <div class="upload-zone">
      <!-- Original cloud preserved as a CSS sprite from the supplied screenshot. --><span class="upload-icon" aria-hidden="true"></span>
      <h1>点击上传病例</h1>
      <p class="limit">为保证出题质量，每次仅上传1份病例<span style="display:inline-block">（可含多张照片）</span></p>
    </div>
    <p class="subtitle">AI将自动脱敏并生成实战题</p>
    <button class="generate" type="button" disabled>生成专属查房</button>
    <div class="cancel">取消</div>
  </main>
</body>
</html>
