<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>分阶段作答预览</title><style>body{max-width:850px;margin:35px auto;padding:20px;background:#f5f6fa;color:#283041;font:16px/1.8 system-ui}section{background:white;border-radius:14px;padding:26px;margin:20px 0}select,button{font:inherit;padding:10px;border-radius:8px}select{max-width:100%}button{background:#6657ba;color:white;border:0;cursor:pointer}label{display:block;padding:14px;margin:10px 0;border:1px solid #ddd;border-radius:8px}small{color:#777}</style><h1>分阶段作答预览</h1><p>只显示当前题；提交后锁定。整组完成后才揭晓答案与病例经过。</p><select id="pick"></select><main id="main"></main><small>本页仅演示交互，不含答案及完整病例。正式产品须由服务端逐题返回并验证提交状态。</small><script>const cases=[{"case_id": "CASE-37BF6300", "title": "乳腺癌的分型与随访评估", "initial_information": "44岁绝经前女性，已诊断乳腺癌伴骨转移。请根据各题提供的检查及治疗阶段信息，判断下一步处理。", "question_count": 5, "questions": [{"id": "Q1", "type": "分子诊断", "phase": "初始受体检测", "timepoint": "一线治疗前", "question": "患者拟启动瑞波西利联合内分泌治疗。为确保HR阳性、HER2阴性的分型可用于选药，最需要核查哪项内容？", "options": {"A": "病理标本处理、检测质控及ER/PR/HER2结果的完整性", "B": "仅核对影像学肿块大小，以此判断是否适合内分泌治疗", "C": "优先依据血清肿瘤标志物，必要时再复核组织学结果", "D": "将JAK2突变作为乳腺癌分型依据，先确定血液病方案"}}, {"id": "Q2", "type": "治疗决策", "phase": "合并症管理", "timepoint": "一线治疗开始", "question": "患者合并JAK2 V617F阳性骨髓增殖性肿瘤，血小板明显升高。制定乳腺癌方案时，如何安排合并症管理更妥当？", "options": {"A": "仅按血小板数值选择抗栓药物，无需进一步评估出血风险", "B": "先等待血液病指标完全正常，再启动乳腺癌系统治疗", "C": "联合血液科评估血栓、出血及骨髓风险，个体化安排治疗", "D": "将血细胞升高视为可抵消骨髓抑制，维持常规监测即可"}}, {"id": "Q3", "type": "分子诊断", "phase": "复发/转移性乳腺癌疑似进展时", "timepoint": "治疗 30 个周期后", "question": "骨转移持续稳定期间，乳房出现快速增大的新肿块，影像高度怀疑局部进展。在改变全身治疗前，最有价值的下一步是什么？", "options": {"A": "直接按耐药更换系统方案，再以缩瘤情况验证诊断", "B": "对可及的新肿块取材，先明确性质，再按结果补充检测", "C": "仅复查原发灶存档标本，将新病灶按同一分型处理", "D": "以肿块增长速度判断来源，直接按乳腺癌局部进展处置"}}, {"id": "Q4", "type": "诊断与分期", "phase": "新病灶病理鉴别", "timepoint": "术后病理明确时", "question": "术后肿块诊断为韧带样纤维瘤。关于这种病变的生物学行为，哪项理解更准确？", "options": {"A": "属于乳腺癌间质成分，诊断后应按乳腺癌进展处理", "B": "属于良性结节，切除后不需要再关注局部复发风险", "C": "具有远处转移倾向，应沿用软组织肉瘤的分期逻辑", "D": "可呈局部侵袭并复发，但通常不发生远处转移"}}, {"id": "Q5", "type": "耐药与后线管理", "phase": "术后继续系统治疗决策时", "timepoint": "目前", "question": "新乳房肿块证实为韧带样纤维瘤，乳腺癌其他病灶仍稳定。对原有全身治疗，哪项决策更合理？", "options": {"A": "局部肿块已切除，可停止转移性乳腺癌系统治疗", "B": "重新核实疗效和耐受性，仍获益时可继续原有方案", "C": "因接受了乳房手术，应改为术后辅助治疗模式", "D": "为避免再次出现肿块，应更换为另一种化疗方案"}}]}, {"case_id": "CASE-DE70CBF4", "title": "乳腺癌术后肾上腺病灶评估", "initial_information": "64岁女性，有乳腺癌手术及后续治疗史，因腹部隐痛就诊，影像随访发现双侧肾上腺病灶。", "question_count": 5, "questions": [{"id": "Q1", "type": "诊断与分期", "phase": "鉴别诊断", "timepoint": "首次随访", "question": "乳腺癌术后患者出现性质未明的双侧肾上腺病灶，拟通过取材指导治疗。何时适合考虑肾上腺活检？", "options": {"A": "PET高摄取后即可安排穿刺，无需再做内分泌评估", "B": "只要有乳腺癌病史，就应以穿刺作为首项检查", "C": "排除嗜铬细胞瘤等功能性风险，且组织结果将改变治疗时", "D": "影像不能确诊时即切除双侧肾上腺，以避免取材误差"}}, {"id": "Q2", "type": "分子诊断", "phase": "复发转移确诊阶段", "timepoint": "病理确诊阶段", "question": "乳腺癌术后约14年出现疑似肾上腺转移。若已安全取得足量组织，重新检测ER、PR及HER2的主要目的是什么？", "options": {"A": "因超过固定年限，原发灶结果在技术上已失效", "B": "识别可能的受体变化，为当前转移阶段重新选药", "C": "证明肾上腺转移必然具有不同于原发灶的分型", "D": "仅评估Ki-67变化，以此决定能否继续内分泌治疗"}}, {"id": "Q3", "type": "治疗决策", "phase": "系统治疗启动", "timepoint": "治疗启动", "question": "转移灶确认为HR阳性、HER2阴性，患者已开始肾上腺激素替代。若无内脏危象且适合联合治疗，哪项方案可合理考虑？", "options": {"A": "评估瑞波西利联合来曲唑，并继续必要的激素替代", "B": "仅因肾上腺是转移部位，就改用内分泌单药治疗", "C": "先切除双侧肾上腺，以此作为系统治疗的前提", "D": "等待肾上腺功能自行恢复，再决定是否抗肿瘤治疗"}}, {"id": "Q4", "type": "治疗决策", "phase": "综合管理", "timepoint": "治疗启动", "question": "原发性肾上腺皮质功能不全患者接受抗肿瘤治疗期间，除日常氢化可的松替代外，还应重点落实哪项管理？", "options": {"A": "仅随访肿瘤缩小程度，据此决定是否停止激素", "B": "监测血压电解质，评估盐皮质激素需求并制定应激用药计划", "C": "感染或手术时维持原替代量，以减少激素相关风险", "D": "出现恶心呕吐时先停用替代药物，等待消化道症状缓解"}}, {"id": "Q5", "type": "不良反应管理", "phase": "毒性管理阶段", "timepoint": "治疗 2 周后", "question": "瑞波西利联合来曲唑治疗2周后出现严重中性粒细胞减少，原文未给出ANC及是否发热。下一步最合理的原则是什么？", "options": {"A": "直接认定为4级毒性，永久停止所有内分泌治疗", "B": "维持瑞波西利剂量，用预防性升白治疗替代剂量管理", "C": "不复查血象即降至最低剂量，按原日程继续服用", "D": "暂缓瑞波西利，明确分级及感染风险后决定恢复剂量"}}]}, {"case_id": "CASE-7D7C02B3", "title": "胰腺癌治疗路径的动态调整", "initial_information": "47岁男性，影像发现胰尾约45 mm病灶，穿刺提示腺癌。初始影像未见明确远处转移。", "question_count": 5, "questions": [{"id": "Q1", "type": "不良反应管理", "phase": "新辅助治疗计划阶段", "timepoint": "新辅助治疗期间", "question": "吉西他滨治疗期间发生2级皮疹，病例将其记录为过敏。考虑再次用药时，最应避免哪种推断？", "options": {"A": "先复核皮疹类型及伴随症状，再评估责任药物", "B": "认为只要降低剂量，就能可靠预防过敏再次发生", "C": "若有黏膜受累或全身症状，进一步排查严重反应", "D": "结合替代方案和反应风险，决定是否需要专科评估"}}, {"id": "Q2", "type": "诊断与分期", "phase": "术中意外发现", "timepoint": "首次手术尝试", "question": "计划胰腺切除时发现肝表面结节，冰冻病理证实其中一处为转移。对原定根治性手术计划，最合理的调整是什么？", "options": {"A": "按原计划切除胰腺，以原发灶技术可切除作为依据", "B": "切除可见肝结节后继续手术，将患者仍按局限期处理", "C": "暂不记录远处转移，待术后影像出现可见病灶再分期", "D": "中止原定根治切除，按转移性疾病重新规划系统治疗"}}, {"id": "Q3", "type": "治疗决策", "phase": "转化治疗维持阶段", "timepoint": "强化化疗阶段", "question": "患者接受含铂SOXIRI约16周后未进展。若拟依据POLO选择奥拉帕利维持，最关键的适用条件是什么？", "options": {"A": "确认致病性胚系BRCA1/2变异，并符合一线含铂治疗后无进展条件", "B": "只需肿瘤报告出现BRCA2字样，无需核对变异性质和来源", "C": "CA19-9恢复正常即可启动，无需考虑既往方案与病程", "D": "只要准备转化手术，就可将奥拉帕利用作标准围手术期药物"}}, {"id": "Q4", "type": "治疗决策", "phase": "转化治疗后评估阶段", "timepoint": "维持治疗阶段", "question": "有病理证实肝转移史的胰腺癌患者，经治疗后CA19-9正常、影像无进展。如何理解其后实施的转化手术？", "options": {"A": "肿瘤标志物正常后，转化切除即可成为常规标准治疗", "B": "影像未见肝病灶后，可删除既往远处转移的诊断记录", "C": "属于高度筛选下的个体化探索，不能由该病例推广为普遍推荐", "D": "只需确认胰腺病灶可切除，无需再次评估肝脏和全身情况"}}, {"id": "Q5", "type": "分子诊断", "phase": "分子报告复核", "timepoint": "评估PARP抑制剂证据时", "question": "病例已有BRCA2突变报告，并在术后继续使用奥拉帕利。就分子信息的核实而言，哪项最重要？", "options": {"A": "明确变异是否致病及是否胚系，并补齐会影响治疗的分子信息", "B": "将肿瘤组织BRCA2突变直接视为遗传性变异并告知家属", "C": "以术后R0切除为依据，认定今后无需关注遗传风险", "D": "将术后用药有效视为依据，反向确认BRCA2必为胚系致病变异"}}]}, {"case_id": "CASE-C38F9D7E", "title": "乳腺癌进展后的检测与选药", "initial_information": "患者既往ER阳性、HER2阴性乳腺癌，经内分泌及化疗后出现病情进展，不愿再次接受组织活检。", "question_count": 5, "questions": [{"id": "Q1", "type": "分子诊断", "phase": "晚期一线治疗前", "timepoint": "2021 年 3 月", "question": "患者拒绝新的组织活检，拟评估PIK3CA靶向治疗。关于血浆ctDNA检测，哪项策略更合理？", "options": {"A": "必须获取新鲜组织后才可考虑任何分子检测", "B": "仅能使用初诊标本，血浆结果不具有选药价值", "C": "可用经验证的血浆检测，阴性时在可行条件下补充组织检测", "D": "血浆未检出突变即可永久排除PIK3CA相关治疗"}}, {"id": "Q2", "type": "治疗决策", "phase": "晚期二线治疗", "timepoint": "2021 年 3 月", "question": "该患者ER阳性、HER2阴性，既往接受内分泌治疗后进展，ctDNA检出PIK3CA突变。评估阿培利司联合氟维司群时，哪项理解正确？", "options": {"A": "所有PIK3CA位点均有同等证据，无需核对具体变异", "B": "需要同时存在ESR1突变，才能考虑该联合治疗", "C": "出现PIK3CA突变后，可忽略既往用药和代谢风险", "D": "核对可用于选药的变异与既往病程，并评估治疗安全性"}}, {"id": "Q3", "type": "分子诊断", "phase": "全程管理", "timepoint": "2021 年 3 月", "question": "ctDNA报告PIK3CA H1047R、R108C及C804R三个位点。对多重突变结果，哪项解释最稳妥？", "options": {"A": "分别核查位点证据，不能仅凭突变数量预测更高疗效", "B": "出现三个位点即说明检测污染，应直接作废报告", "C": "三个突变说明三倍靶点负荷，应相应提高药物剂量", "D": "只有检测到三个突变时，才满足PI3K抑制剂使用条件"}}, {"id": "Q4", "type": "不良反应管理", "phase": "靶向治疗毒性处理", "timepoint": "用药 10 天后", "question": "阿培利司治疗后出现皮疹，病例记录减量至250 mg，但未说明分级。规范处理时应如何判断？", "options": {"A": "直接将病例剂量变化等同于3级皮疹，不再补充评估", "B": "评估范围及全身黏膜症状，按分级处理并排查严重皮肤反应", "C": "只需给予抗组胺药，皮疹不影响后续剂量安排", "D": "等待出现继发感染后，再决定是否暂停靶向治疗"}}, {"id": "Q5", "type": "疗效复评与局部治疗", "phase": "靶向治疗维持期", "timepoint": "治疗 18 个月时", "question": "系统治疗获益约18个月后，仅肝脏少数病灶进展。关于继续原方案并联合局部放疗，哪项评价更准确？", "options": {"A": "肝脏出现进展后，即可只保留局部治疗控制全身疾病", "B": "任何少数病灶进展都应立即改为化疗，局部治疗无价值", "C": "原方案有效时间较长，增加阿培利司剂量即可逆转耐药", "D": "可由MDT在确认有限进展后讨论，但不属于普遍适用策略"}}]}, {"case_id": "CASE-CA70947A", "title": "胰腺肿瘤的治疗与手术评估", "initial_information": "76岁女性因上腹痛、恶心就诊，胰头肿瘤累及主要血管，初步评估不可切除。", "question_count": 5, "questions": [{"id": "Q1", "type": "治疗决策", "phase": "新辅助转化治疗", "timepoint": "初诊评估为不可切除后", "question": "胰头肿瘤累及主要血管，初评不可切除且无远处转移。若病理明确、患者可耐受治疗，哪项初始策略更合适？", "options": {"A": "先行手术探查，以术中判断代替治疗前可切除性评估", "B": "以单纯局部放疗作为既定方案，暂不考虑系统治疗", "C": "评估吉西他滨联合白蛋白紫杉醇等系统方案并动态复评", "D": "仅因影像提示不可切除，就转为单纯症状支持治疗"}}, {"id": "Q2", "type": "诊断与分期", "phase": "新辅助治疗期间评估", "timepoint": "新辅助化疗 3 个月疗效部分缓解但仍无法切除时", "question": "治疗3个月后肿瘤达到PR，但仍不可切除，尚无远处进展。若毒性可控，下一步更合理的决策是什么？", "options": {"A": "仅因仍不可切除就终止有效方案，改为姑息旁路手术", "B": "无论耐受情况如何，都立即降为吉西他滨单药", "C": "将未获得切除机会等同于PD，改用全部不同的药物", "D": "继续有效方案，并定期结合血管关系和全身情况复评"}}, {"id": "Q3", "type": "疗效复评与局部治疗", "phase": "新辅助治疗后评估", "timepoint": "新辅助化疗 7 个月评估后", "question": "约7个月治疗后，肿瘤缩小、血管受累改善，未见远处转移且CA19-9下降。此时应如何评估手术机会？", "options": {"A": "继续原方案直到出现进展，再讨论是否局部处理", "B": "由有经验的MDT评估R0可能性及手术风险，再决定探查切除", "C": "仅凭CA19-9下降即可安排手术，无需复核血管关系", "D": "以影像缩小作为根治证据，停止治疗并进入随访"}}, {"id": "Q4", "type": "诊断与分期", "phase": "术后病理评估", "timepoint": "胰十二指肠切除术后", "question": "新辅助治疗后完成胰十二指肠切除。病理报告应重点涵盖哪组信息？", "options": {"A": "残余肿瘤范围、治疗反应、切缘及淋巴结状态", "B": "初诊最大径、影像反应及血清标志物变化即可", "C": "以Ki-67为主，并用其变化代替切缘和淋巴结评估", "D": "仅报告是否存在肿瘤，分期沿用治疗前临床结果"}}, {"id": "Q5", "type": "治疗决策", "phase": "术后辅助治疗", "timepoint": "胰十二指肠切除术后", "question": "患者术前已接受约7个月化疗，之后获得R0切除。关于术后系统治疗，哪项原则更妥当？", "options": {"A": "R0切除后均不再需要讨论辅助治疗", "B": "无论既往疗程多少，术后均应常规追加放疗", "C": "结合术前暴露、病理和恢复情况，由MDT决定后续治疗", "D": "按固定一年目标延长同一方案，无需考虑累积毒性"}}]}, {"case_id": "CASE-F5639B6F", "title": "胃癌系统治疗与复评决策", "initial_information": "66岁女性因吞咽困难就诊，检查发现胃部肿瘤及多发肝脏病灶，拟进一步制定治疗方案。", "question_count": 5, "questions": [{"id": "Q1", "type": "分子诊断", "phase": "初诊评估", "timepoint": "诊断时", "question": "IV期胃癌启动系统治疗前，哪种检测安排更能支持选药？", "options": {"A": "仅检测HER2，其余项目待首次进展后再考虑", "B": "只做常规病理，待手术大标本再补齐所有分子信息", "C": "完善HER2、PD-L1、MMR/MSI等与可用方案相关的检测", "D": "根据肝转移数量选择药物，无需区分分子分型"}}, {"id": "Q2", "type": "诊断与分期", "phase": "病理诊断", "timepoint": "检查时", "question": "小活检提示低分化腺癌，可能伴神经内分泌分化。下一步病理评估哪项更合适？", "options": {"A": "结合形态补充Syn、CgA、Ki-67等，并评估取样局限", "B": "单凭低分化形态即诊断神经内分泌癌并更改方案", "C": "发现任一神经内分泌标记阳性即可确诊混合性肿瘤", "D": "以PET代谢高低取代补充免疫组化及形态学复核"}}, {"id": "Q3", "type": "分子诊断", "phase": "PD-L1证据解释", "timepoint": "初始系统治疗评估时", "question": "HER2阴性胃癌伴肝转移，病例PD-L1 CPS为8并采用XELOX联合替雷利珠单抗。解释PD-L1证据时，哪项说法更准确？", "options": {"A": "CPS为8即可直接换算为TAP≥5%，两种评分可以互换", "B": "应核对方案对应的检测方法，CPS不能直接换算为TAP", "C": "HER2阴性即可省略PD-L1评估，评分不影响证据解释", "D": "PD-L1阳性说明可省略化疗，直接采用免疫单药"}}, {"id": "Q4", "type": "疗效复评与局部治疗", "phase": "转化治疗评估", "timepoint": "第 5 疗程后", "question": "治疗后肝转移灶影像消失，拟评估胃部转化手术。除影像外，哪项检查有助于识别隐匿腹膜转移？", "options": {"A": "根据风险进行分期腹腔镜，必要时同步腹腔灌洗细胞学", "B": "直接开腹切除胃原发灶，以术后病理完成全部分期", "C": "以PET阴性排除微小腹膜病灶，不再考虑进一步评估", "D": "仅用CA19-9和CEA正常作为腹膜无转移的依据"}}, {"id": "Q5", "type": "治疗决策", "phase": "术后辅助治疗", "timepoint": "术后恢复期", "question": "患者原为IV期胃癌，转化切除后原发灶达到pCR。关于术后继续化疗和免疫治疗，哪项解释最妥当？", "options": {"A": "原发灶pCR意味着全身根治，可以停止所有复评", "B": "应等到出现影像复发，再讨论是否恢复系统治疗", "C": "所有患者都必须在术后第4周开始固定免疫疗程", "D": "结合术前治疗、恢复及风险个体化决定，不能套用统一时间表"}}]}, {"case_id": "CASE-B559946D", "title": "男性乳腺癌的综合治疗决策", "initial_information": "61岁男性，乳腺癌伴肝、骨病灶。请结合各题给出的分型、器官功能和既往用药作判断。", "question_count": 5, "questions": [{"id": "Q1", "type": "分子诊断", "phase": "遗传风险评估", "timepoint": "完善胚系检测时", "question": "这名男性乳腺癌患者拟完善遗传风险评估。哪项检测及配套措施具有明确价值？", "options": {"A": "仅检测PIK3CA，并以阴性结果排除家族遗传风险", "B": "结合遗传咨询提供胚系易感基因检测，包括BRCA1/2", "C": "只检测ESR1，因其可以解释男性发生乳腺癌的遗传原因", "D": "只检测PD-L1，并以其表达判断家属是否需要筛查"}}, {"id": "Q2", "type": "治疗决策", "phase": "晚期一线治疗", "timepoint": "初诊时", "question": "男性HR阳性、HER2阴性乳腺癌伴广泛肝转移，病例称存在肝危机。决定是否按内脏危象处理时，哪项原则最重要？", "options": {"A": "核实器官功能受损程度和变化速度，选择能及时控制病情的方案", "B": "只要存在多发肝转移，就应认定所有内分泌方案均禁用", "C": "仅以最大肝病灶直径，决定是否必须采用紫杉类化疗", "D": "根据ER表达较高，直接排除快速进展导致内脏危象的可能"}}, {"id": "Q3", "type": "疗效复评与局部治疗", "phase": "二线治疗", "timepoint": "一线治疗 4 周期后", "question": "白蛋白紫杉醇治疗4周期后肝病灶略有缩小，评价为SD。复盘下一步选择时，哪项原则更合理？", "options": {"A": "将SD直接视为耐药，立即转换二线药物", "B": "仅因未达到PR，就结束全部抗肿瘤治疗", "C": "结合症状、肝功能和毒性判断，仍获益时可考虑继续", "D": "按原方案持续至影像PD，不必考虑器官功能和耐受性"}}, {"id": "Q4", "type": "耐药与后线管理", "phase": "三线治疗", "timepoint": "二线治疗 7 周期后", "question": "卡培他滨后进展，患者既往未使用CDK4/6抑制剂。若当前器官功能允许、无迫切危象，如何评估内分泌联合治疗？", "options": {"A": "因已接受两线化疗，后续不再可能从内分泌治疗获益", "B": "只根据既往药物数量，直接安排同类化疗再挑战", "C": "把内分泌治疗单药视为男性患者唯一可用选择", "D": "结合HR状态与既往暴露，讨论CDK4/6抑制剂联合内分泌"}}, {"id": "Q5", "type": "不良反应管理", "phase": "三线治疗期间", "timepoint": "三线治疗 3 个月后", "question": "患者因严重潮热暂停戈舍瑞林，并更换内分泌骨架。对男性患者使用芳香化酶抑制剂的方案复核，哪项最重要？", "options": {"A": "只要继续CDK4/6抑制剂，即可维持芳香化酶抑制剂单用", "B": "兼顾症状管理与方案完整性，复核是否需要GnRH联合抑制", "C": "把主诉“严重”直接记录为CTCAE 3级并统一减量", "D": "任何潮热都提示内分泌治疗禁忌，应改用细胞毒化疗"}}]}, {"case_id": "CASE-761970EB", "title": "胰腺神经内分泌肿瘤的全程管理", "initial_information": "患者发现胰腺及多发肝脏病灶，已经接受肝病灶穿刺。各阶段病理、用药和复评信息见题干。", "question_count": 5, "questions": [{"id": "Q1", "type": "分子诊断", "phase": "初始诊断与分级", "timepoint": "2021 年 2 月", "question": "肝穿刺提示胰腺神经内分泌肿瘤，Ki-67约10%。对有限标本的分级，哪项解读最妥当？", "options": {"A": "必须等到手术标本后，才可报告任何增殖分级", "B": "结合分化形态、Ki-67热点及有丝分裂评估，并注明取样局限", "C": "Syn阳性已足够确定低级别，无需进一步计数", "D": "小标本优先归入G1，以避免因局部热点高估分级"}}, {"id": "Q2", "type": "治疗决策", "phase": "一线系统治疗", "timepoint": "2021 年 4 月", "question": "患者为非功能型、分化较好的G2胰腺NET，SSTR2免疫组化阳性，局部治疗后病情较稳定。评估SSA时，哪项说法更准确？", "options": {"A": "非功能型说明没有激素症状，因此SSA没有抗肿瘤价值", "B": "SSTR2阳性即可替代全部受体显像和全身负荷评估", "C": "可结合受体状态、负荷和进展速度讨论SSA的抗增殖作用", "D": "Ki-67为10%就必须首先使用铂类化疗，不能考虑SSA"}}, {"id": "Q3", "type": "不良反应管理", "phase": "治疗副作用处理", "timepoint": "2021 年 10 月", "question": "奥曲肽治疗中出现头晕并自行停药。最合理的后续安排是什么？", "options": {"A": "将头晕直接归为不可逆神经毒性，停止所有肿瘤治疗", "B": "不评估原因，直接按原剂量恢复并取消额外随访", "C": "以另一种靶向药替换SSA，无需先判断症状来源", "D": "评估血糖、血压等可能原因，再决定对症处理或调整方案"}}, {"id": "Q4", "type": "治疗决策", "phase": "进展后二线治疗", "timepoint": "2023 年 9 月", "question": "失访后病灶明显进展，伴腹水和肾功能异常。MDT认为再次取材风险较高，下一步选药应如何权衡？", "options": {"A": "综合体能、器官功能、进展速度和既往病理，明确证据局限", "B": "必须获得新病理才能开展任何治疗，不考虑病情紧迫性", "C": "直接沿用两年前Ki-67，认定肿瘤生物学行为没有变化", "D": "仅凭肾功能异常就排除全部系统治疗，转为局部干预"}}, {"id": "Q5", "type": "疗效复评与局部治疗", "phase": "联合治疗阶段", "timepoint": "2023 年 11 月", "question": "系统治疗期间肝肿瘤负荷仍高，拟增加TACE。下列哪项最能体现局部治疗的合理定位？", "options": {"A": "出现肝转移后，应以TACE替代所有系统治疗", "B": "仅按肝肿瘤大小决定，无需考虑腹水及肝功能", "C": "评估肝储备、血管和肾功能后，将其作为综合治疗补充", "D": "只要已有肝外病灶，就不再可能讨论任何肝局部治疗"}}]}, {"case_id": "CASE-BE8833A9", "title": "直肠癌肝转移的动态管理", "initial_information": "56岁男性因便血就诊，直肠活检提示腺癌，肝脏双叶有多发转移灶，初判不可切除。", "question_count": 5, "questions": [{"id": "Q1", "type": "疗效复评与局部治疗", "phase": "转化治疗评估", "timepoint": "2015 年 10 月", "question": "化疗13周期后，肝转移灶大幅缩小，仅余肝Ⅵ段约1 cm结节。此时最合理的局部治疗决策是什么？", "options": {"A": "继续治疗直到全部病灶影像消失，再讨论局部处理", "B": "及时由MDT评估可切除性及原始病灶位置，制定局部计划", "C": "固定再观察6个月，不受当前可切除性变化影响", "D": "影像病灶接近消失即可停止治疗，改为单纯随访"}}, {"id": "Q2", "type": "疗效复评与局部治疗", "phase": "转化治疗评估", "timepoint": "2015 年 10 月", "question": "患者既往使用贝伐珠单抗，拟接受择期大手术。术前后用药计划应遵循哪项原则？", "options": {"A": "末次用药后可立即手术，只需术后延迟下一次输注", "B": "以血象正常作为可以手术的依据，无需核对末次用药时间", "C": "术后出院即可恢复贝伐珠单抗，无需检查切口愈合", "D": "留足术前停药间隔，术后至少28天且伤口充分愈合再恢复"}}, {"id": "Q3", "type": "诊断与分期", "phase": "胃溃疡鉴别", "timepoint": "放化疗后发现胃部深溃疡时", "question": "放化疗后胃镜发现深溃疡，首次活检仅见溃疡碎片。复盘诊断和安全管理，哪项原则最合理？", "options": {"A": "首次活检未见癌就足以排除恶性，后续无需再关注", "B": "直接认定为3级药物毒性，只需按统一减量规则处理", "C": "评估出血穿孔及治疗损伤，并按持续疑点安排复查取材", "D": "以PET摄取高低替代组织评估，直接判定是否肿瘤侵犯"}}, {"id": "Q4", "type": "分子诊断", "phase": "复发后检测", "timepoint": "2023 年 4 月", "question": "多次复发且曾接受抗EGFR治疗，拟调整后线方案。怎样复核分子信息更合理？", "options": {"A": "只参考初诊KRAS阴性，不再关注检测范围和时效", "B": "优先重复EGFR突变检测，用于替代扩展RAS评估", "C": "结合拟选药物核对RAS/BRAF及MMR/MSI等，必要时补充组织或血浆检测", "D": "每次复发均必须侵入性取材，不考虑已有标本与取材风险"}}, {"id": "Q5", "type": "治疗决策", "phase": "多线治疗后管理", "timepoint": "2023 年 5 月", "question": "患者已接受多线标准化疗及靶向治疗，仍需评估后线方案。哪项组合属于有依据的可讨论选择？", "options": {"A": "根据既往暴露和耐受性，考虑曲氟尿苷替匹嘧啶相关方案或瑞戈非尼", "B": "重复已明确进展的氟尿嘧啶单药，以用药方便作为主要依据", "C": "采用高剂量原方案，按剂量增加即可逆转耐药的思路处理", "D": "仅根据治疗线数较多，直接排除所有后线药物选择"}}]}, {"case_id": "CASE-51D1DA57", "title": "乳腺癌术后新发皮肤病变", "initial_information": "51岁女性，有乳腺癌手术及辅助治疗史，胸壁和上肢出现反复红斑、水肿，抗感染后仍反复。", "question_count": 5, "questions": [{"id": "Q1", "type": "诊断与分期", "phase": "皮肤异常鉴别", "timepoint": "皮肤病变反复时", "question": "胸壁及上肢丹毒样皮肤病变反复，患者有乳腺癌病史。皮肤活检最重要的临床价值是什么？", "options": {"A": "只验证是否感染，受体状态始终沿用原发灶结果", "B": "仅比较Ki-67高低，以其变化作为复发的独立诊断依据", "C": "抗生素曾使症状缓解，因此无需进一步区分肿瘤因素", "D": "明确病灶性质和来源，并重新评估可影响选药的受体状态"}}, {"id": "Q2", "type": "治疗决策", "phase": "复发转移二线治疗阶段", "timepoint": "2024 年 6 月 30 日", "question": "患者既往接受辅助抗HER2治疗，现出现远处复发。决定是否再次采用抗HER2单抗为基础的方案时，最需要补齐什么信息？", "options": {"A": "仅需确认既往用过曲妥珠单抗，即应排除全部单抗方案", "B": "核对末次辅助用药时间、既往疗效毒性及本次复发范围", "C": "仅以首次手术日期计算间隔，无需知道靶向治疗结束时间", "D": "只要有脑转移，即无需讨论既往抗HER2治疗经过"}}, {"id": "Q3", "type": "疗效复评与局部治疗", "phase": "脑转移管理", "timepoint": "2024 年 5 月", "question": "HER2阳性乳腺癌伴脑及颅外转移，已接受全脑放疗。筛选后续系统方案时，哪项依据最有价值？", "options": {"A": "优先比较具体方案的颅内和全身临床证据，并结合既往用药", "B": "按分子体积由小到大排序，即可预测所有药物的颅内疗效", "C": "完成全脑放疗后，颅外病灶可等待脑病灶完全消失再治疗", "D": "只依据血脑屏障穿透的理论推测，不需要核对临床研究"}}, {"id": "Q4", "type": "治疗决策", "phase": "复发转移治疗", "timepoint": "2024 年 6 月 30 日", "question": "患者采用曲妥珠单抗、吡咯替尼及卡培他滨治疗。将其中“双药研究”用于解释三药方案时，哪项表述最严谨？", "options": {"A": "吡咯替尼加卡培他滨有效，即可认为加单抗后三药证据完全相同", "B": "曾接受辅助曲妥珠单抗，就自动满足所有晚期二线研究条件", "C": "应分别核对组合、线次及脑转移人群，不能直接把双药证据移用于三药", "D": "只要三种药都具有抗肿瘤活性，组合的临床证据即可视为充分"}}, {"id": "Q5", "type": "疗效复评与局部治疗", "phase": "疗效监测", "timepoint": "2024 年 7 月 30 日", "question": "放疗及三药系统治疗后，皮肤病变改善，脑MRI病灶缩小。下一步管理哪项更妥当？", "options": {"A": "脑病灶未消失即可认定方案失败，立即追加手术", "B": "将颅内缩小完全归功于三药，忽略此前全脑放疗影响", "C": "只随访肿瘤标志物，达到下降即可取消影像复评", "D": "综合颅内外疗效和毒性，仍获益时继续治疗并规律复评"}}]}, {"case_id": "CASE-8C6E34E9", "title": "胃癌复发后的靶点与治疗评估", "initial_information": "70岁男性，胃癌根治术后1年7个月发现腹主动脉旁淋巴结复发，拟评估后续系统治疗。", "question_count": 5, "questions": [{"id": "Q1", "type": "分子诊断", "phase": "HER2检测质量控制", "timepoint": "复发后评估抗HER2治疗时", "question": "患者胃癌术后标本HER2 IHC为3+。复发后，若新取活检标本的HER2结果与既往不一致，首先应如何核查检测质量？", "options": {"A": "以手术标本体积更大为由，直接沿用既往结果", "B": "以本次取材时间更近为由，直接采用本次结果", "C": "复核固定条件、肿瘤取样及胃癌专用评分标准", "D": "采用乳腺癌评分规则，重新判读两次染色结果"}}, {"id": "Q2", "type": "治疗决策", "phase": "一线治疗后进展", "timepoint": "含曲妥珠单抗方案进展后", "question": "患者复发后一线接受S-1、顺铂联合曲妥珠单抗，随后进展。关于更换化疗后继续使用曲妥珠单抗，T-ACT研究提供了什么证据？", "options": {"A": "换用紫杉醇后继续曲妥珠单抗，可确立为常规跨线方案", "B": "该跨线策略未改善无进展生存，不能据此确立常规使用", "C": "既往接受曲妥珠单抗后进展，提示后续HER2靶向均无效", "D": "只要治疗前HER2为3+，就可预测跨线曲妥珠单抗获益"}}, {"id": "Q3", "type": "治疗决策", "phase": "多线治疗后选择", "timepoint": "六线治疗启动前", "question": "患者HER2阳性胃癌已接受五线治疗，包括曲妥珠单抗及多种化疗。若复核靶点、体能状态和器官功能后仍适合抗肿瘤治疗，下列哪项有相应后线研究支持？", "options": {"A": "评估采用德曲妥珠单抗，并同步制定毒性监测计划", "B": "重新采用曲妥珠单抗单药，按初始HER2结果选择", "C": "将已进展的纳武利尤单抗加量，争取逆转免疫耐药", "D": "改用另一种HER2酪氨酸激酶抑制剂，视为等效替代"}}, {"id": "Q4", "type": "分子诊断", "phase": "进展后靶点复评", "timepoint": "后续HER2靶向治疗决策前", "question": "患者最初胃癌标本HER2 IHC为3+，之后经历多线治疗。关于这一历史结果对后续选药的意义，下列哪项最准确？", "options": {"A": "既往3+可以替代后续复评，持续进展主要反映药物剂量不足", "B": "转移至肺说明靶点已经丢失，应按HER2阴性重新制定方案", "C": "既往抗HER2治疗无效，足以推定当前组织已不再表达HER2", "D": "历史阳性不能保证靶点持续存在，条件允许时可复评当前病灶"}}, {"id": "Q5", "type": "疗效复评与局部治疗", "phase": "深度缓解后的管理", "timepoint": "德曲妥珠单抗治疗达到临床CR后", "question": "本例在德曲妥珠单抗治疗后达到并维持临床完全缓解。将这一结果用于其他同类患者的管理时，下列哪项最妥当？", "options": {"A": "首次确认临床CR后停药，以肿瘤标志物决定何时恢复", "B": "结合持续获益、毒性及患者意愿决定疗程，并定期复评", "C": "临床CR持续一年后改为免疫维持，以减少ADC暴露", "D": "临床CR后切除既往转移部位，以此确认已获得根治"}}]}, {"case_id": "CASE-A8792225", "title": "转移性直肠癌的分阶段决策", "initial_information": "38岁女性，阻塞性直肠癌伴多发肝转移，已获得原发灶切除标本，拟制定系统治疗方案。", "question_count": 5, "questions": [{"id": "Q1", "type": "分子诊断", "phase": "基线分子评估", "timepoint": "直肠原发灶切除后", "question": "患者直肠癌伴多发肝转移，已有原发灶切除标本。为评估抗EGFR治疗的分子条件，关于RAS检测取材，下列哪项最合理？", "options": {"A": "优先评估现有原发灶标本质量，合格原发灶或转移灶均可检测", "B": "先行肝穿刺获取转移组织，原发灶结果不足以用于选药", "C": "以BRAF V600E阴性替代RAS检测，减少分子检测项目", "D": "只检测KRAS外显子2，结果野生型即可完成RAS评估"}}, {"id": "Q2", "type": "治疗决策", "phase": "初始系统治疗", "timepoint": "术后启动转化治疗前", "question": "患者直肠癌伴初始不可切除肝转移，RAS野生型、BRAF V600E阴性。若综合评估后选择“化疗联合西妥昔单抗”进行转化治疗，下列哪种化疗骨架最符合常用证据？", "options": {"A": "卡培他滨单药，依据原发灶已切除而降低转化治疗强度", "B": "氟尿嘧啶单药，依据RAS野生型预期已足以获得肝转化", "C": "FOLFOX或FOLFIRI，按器官功能及既往毒性选择骨架", "D": "FOLFOXIRI，依据肝转移多发即常规叠加西妥昔单抗"}}, {"id": "Q3", "type": "不良反应管理", "phase": "转化治疗毒性处理", "timepoint": "出现3级皮疹和2级神经病变时", "question": "含铂化疗联合西妥昔单抗期间，患者出现3级皮疹和2级神经病变。关于后续处理，下列哪项更合理？", "options": {"A": "维持西妥昔单抗原计划，仅因神经病变降低铂类剂量", "B": "按皮疹严重程度暂缓西妥昔单抗，并分别评估神经毒性", "C": "将两种毒性均归于西妥昔单抗，恢复后仅减少该药剂量", "D": "将皮疹视为疗效较好的标志，局部处理后维持全部剂量"}}, {"id": "Q4", "type": "疗效复评与局部治疗", "phase": "转化治疗再评估", "timepoint": "初始治疗约3个月、肝转移灶PR但仍不可切除时", "question": "治疗约3个月后，患者肝转移灶达到PR，但仍不可切除，且已有皮疹与神经毒性。下一步最合适的策略是什么？", "options": {"A": "依据PR直接安排肝切除，术后再处理可能残留的病灶", "B": "维持含铂方案原强度，等影像CR后再讨论外科介入", "C": "以暂不可切除判定转化失败，尽快更换全部抗肿瘤药物", "D": "结合毒性调整有效方案，并由肝脏外科参与反复评估"}}, {"id": "Q5", "type": "不良反应管理", "phase": "后线治疗安全管理", "timepoint": "FOLFOX治疗期间发生过敏反应后", "question": "患者后续接受FOLFOX时发生过敏反应，原文未交代责任药物及严重程度。对这一事件最恰当的处理原则是什么？", "options": {"A": "急性期停止可疑输注并处理，随后评估责任药物及再暴露风险", "B": "按奥沙利铂累积毒性处理，下次将全部药物等比例减量", "C": "以既往能够耐受FOLFOX为据，下一周期按原方案继续", "D": "先更换为卡铂联合氟尿嘧啶，以避免再次暴露奥沙利铂"}}]}, {"case_id": "CASE-55BF9202", "title": "食管癌术后新发肺部病灶", "initial_information": "69岁女性，食管癌综合治疗后随访近3年，因咳嗽、咳痰发现左肺上叶病灶增大。", "question_count": 5, "questions": [{"id": "Q1", "type": "诊断与分期", "phase": "肺部新病灶鉴别", "timepoint": "2024年8月29日左肺上叶穿刺活检后", "question": "食管鳞癌术后近3年，患者左肺上叶病灶穿刺显示低分化鳞状细胞癌免疫表型。鉴别食管癌肺转移与新发肺鳞癌，哪项判断最恰当？", "options": {"A": "肺部检出鳞癌即可确定肺原发，食管癌病史不改变判断", "B": "结合既往食管病理、形态及影像分布综合判断病灶来源", "C": "鳞状细胞相关标记阳性即可证明食管来源，无需进一步比较", "D": "左下肺支气管镜未见恶性证据，即可排除左上肺恶性病灶"}}, {"id": "Q2", "type": "诊断与分期", "phase": "复发范围评估", "timepoint": "2024年9月PET-CT后", "question": "PET-CT除左上肺病灶外，还提示胸膜异常及多站可疑淋巴结，同时存在支气管扩张伴感染。此时能否直接认定为单发肺寡转移？", "options": {"A": "可以，只需按已取得恶性病理的病灶数量进行计数", "B": "可以，感染背景下的淋巴结代谢增高可按炎症处理", "C": "暂不能，应结合进一步检查和随访明确可疑病灶性质", "D": "暂不能，PET提示的异常淋巴结均应先按多发转移处理"}}, {"id": "Q3", "type": "疗效复评与局部治疗", "phase": "系统治疗后的复评", "timepoint": "MDT拟先行系统治疗时", "question": "MDT拟先行化疗联合抗PD-1治疗，再讨论肺部局部干预。为使后续决策有据可依，复评应重点回答什么问题？", "options": {"A": "全身病灶是否受控、可疑部位是否澄清，以及局部治疗是否可行", "B": "左上肺病灶是否达到CR，以此作为启动局部治疗的必要条件", "C": "肿瘤标志物是否降至正常，以此替代胸膜和淋巴结影像复评", "D": "呼吸道症状是否改善，以此判断感染和肿瘤均已得到控制"}}, {"id": "Q4", "type": "疗效复评与局部治疗", "phase": "异时性寡转移策略", "timepoint": "讨论系统治疗与局部治疗顺序时", "question": "本例食管原发灶术后控制近3年。若进一步评估确认符合寡转移条件，关于系统治疗与局部治疗的顺序，下列哪项最准确？", "options": {"A": "间隔超过2年说明转移生物学温和，可省略全身再分期", "B": "曾经接受胸部放疗意味着不宜局部干预，应仅用系统治疗", "C": "存在寡转移就应先完整实施系统治疗，再考虑任何局部处理", "D": "较长无病间隔可支持讨论前置局部治疗，具体顺序由MDT决定"}}, {"id": "Q5", "type": "治疗决策", "phase": "寡转移研究证据解读", "timepoint": "向患者解释联合局部治疗的依据时", "question": "讨论ESO-Shanghai 13研究对本例的参考价值时，下列哪项解释最恰当？", "options": {"A": "研究支持将局部治疗推广到转移范围尚未明确的食管癌患者", "B": "研究支持原发受控、有限转移的筛选人群，但不能直接保证本例获益", "C": "研究证明局部治疗可替代系统治疗，适用于化疗耐受性较差者", "D": "研究已通过Ⅲ期验证，可据此预测本例联合治疗后的治愈概率"}}]}, {"case_id": "CASE-B5FF3EFE", "title": "乳腺癌复发与急症处理", "initial_information": "33岁女性，既往乳腺癌为HR阳性，术后内分泌治疗期间发现淋巴结及骨转移，需重新评估治疗。", "question_count": 5, "questions": [{"id": "Q1", "type": "分子诊断", "phase": "首次远处复发评估", "timepoint": "出现淋巴结和骨转移、拟调整系统治疗时", "question": "患者原发乳腺癌为HR阳性，术后内分泌治疗期间出现淋巴结和骨转移。制定新的系统治疗方案前，哪项信息最值得通过可及病灶活检重新确认？", "options": {"A": "仅确认转移病灶是否来自乳腺，分型沿用原发灶结果", "B": "仅复测Ki-67，以增殖水平决定是否继续内分泌治疗", "C": "确认病灶性质并复测ER、PR和HER2，结合临床重新分型", "D": "优先检测血清肿瘤标志物，以其变化推断转移灶受体状态"}}, {"id": "Q2", "type": "不良反应管理", "phase": "心包填塞急症处理", "timepoint": "胸腔引流后仍加重、心脏超声提示大量心包积液时", "question": "患者胸腔引流后仍气促加重、无法平卧并出现少尿，检查提示大量心包积液及心包填塞。此时应优先采取哪项措施？", "options": {"A": "紧急 : "胃癌治疗耐受与疗效复评", "initial_information": "59岁男性，胃窦腺癌伴多发肝转移，拟接受系统治疗。检测、毒性及复评结果随题提供。", "question_count": 5, "questions": [{"id": "Q1", "type": "分子诊断", "phase": "初诊资料复盘", "timepoint": "对2016年病例进行教学复盘", "question": "本例胃癌记录HER2阴性、CPS＜1及pMMR。若按所引2024年指南评估类似的新诊断转移性胃癌患者，哪项检测策略更完整？", "options": {"A": "HER2阴性后仅复查肿瘤标志物，停止其他预测性检测", "B": "CPS＜1即可按dMMR处理，省略MMR/MSI评估", "C": "将常规全外显子测序作为上述组织检测的统一替代", "D": "核对HER2、PD-L1及MMR/MSI，结合治疗可及性评估CLDN18.2"}}, {"id": "Q2", "type": "不良反应管理", "phase": "CAPOX治疗监测", "timepoint": "第5周期出现骨髓毒性时", "question": "患者第5周期出现骨髓毒性，影像显示缩小，但摘要未给出中性粒细胞和血小板计数。决定下一周期能否按时给药前，最关键的是？", "options": {"A": "直接把奥沙利铂改为另一种铂类，不再评估血象", "B": "因肿瘤缩小而维持原剂量，仅增加一次影像检查", "C": "只依据“骨髓毒性”一词将其定为4级并永久停药", "D": "核对血细胞计数、感染或出血及恢复情况，再决定延迟或减量"}}, {"id": "Q3", "type": "治疗决策", "phase": "因毒性终止治疗", "timepoint": "完成9周期后", "question": "患者因持续血液学毒性停用CAPOX，停药时影像尚未达到CR。仅依据这一时点的信息，如何评价停药决定？", "options": {"A": "后来出现CR证明所有同类患者均应固定9周期停药", "B": "因尚未CR，应不论血象如何都立即换用更强联合方案", "C": "已有9周期疗程即可认定治愈，之后仅在有症状时检查", "D": "依据当时耐受性与疾病状态权衡，并安排复评，不能用后来CR倒推停药标准"}}, {"id": "Q4", "type": "疗效复评与局部治疗", "phase": "疗效证据解释", "timepoint": "2018年影像及2021年胃镜复评", "question": "影像记录完全缓解，胃镜局部活检未见肿瘤细胞，但没有原发灶与肝转移灶完整切除标本。哪项表述最准确？", "options": {"A": "胃镜活检阴性即可证明既往所有肝转移灶均无存活细胞", "B": "记录影像及局部活检结果，不据此宣布全部病灶达到pCR", "C": "影像与胃镜结果不一致时，应固定采用较乐观的结果", "D": "只要影像CR，就能将临床分期改为从未发生过转移"}}, {"id": "Q5", "type": "疗效复评与局部治疗", "phase": "长期随访", "timepoint": "停药后持续缓解阶段", "question": "患者长期未见进展，希望减少检查。拟定随访方案时，哪项最合理？", "options": {"A": "以CEA持续正常替代所有影像复查", "B": "因已多年CR而完全终止肿瘤随访", "C": "统一每3个月PET/CT，无论症状和既往检查结果", "D": "结合原转移范围、症状和治疗史个体化安排临床及影像复评"}}]}, {"case_id": "CASE-6A44390F", "title": "胆道癌后线治疗的证据与安全性", "initial_information": "57岁男性，胆总管腺癌术后复发，经再次手术及多线治疗后进展，需评估后续治疗。", "question_count": 5, "questions": [{"id": "Q1", "type": "分子诊断", "phase": "多线进展后的靶点评估", "timepoint": "HER2免疫组化阳性、FISH提示扩增", "question": "拟参考HERB研究考虑T-DXd时，现有报告只写“HER2免疫组化阳性、FISH扩增”。最应补核对哪项？", "options": {"A": "将“免疫组化阳性”统一改记为IHC 3+", "B": "IHC具体评分、ISH判定及标本来源，核对研究的HER2入组定义", "C": "将FISH扩增直接改记为HER2激活突变", "D": "仅核对CA19-9是否升高，替代组织HER2判断"}}, {"id": "Q2", "type": "治疗决策", "phase": "后线证据选择", "timepoint": "多线胆道癌治疗进展后", "question": "HERB研究提示T-DXd对部分HER2阳性胆道癌有活性。用于解释本例后线选择时，哪项表述最准确？", "options": {"A": "HER2阳性组全部缓解，因此可预测本例必然获益", "B": "研究已随机比较T-DXd与仑伐替尼，证明联合更优", "C": "研究证实所有IHC 1+胆道癌均适合相同治疗", "D": "单臂Ⅱ期结果支持活性信号，但不能证明优于所有其他后线方案"}}, {"id": "Q3", "type": "疗效复评与局部治疗", "phase": "疑似进展复核", "timepoint": "CA19-9回升且PET仍有代谢活性", "question": "T-DXd治疗约4个月，CA19-9由低点回升，PET提示仍有肿瘤代谢活性，但未给出可比病灶尺寸或明确新灶。更合适的下一步是？", "options": {"A": "结合症状和可比影像复核是否进展，再讨论调整方案", "B": "只要此前曾缩小，就忽略这次指标与影像变化", "C": "以PET仍有摄取直接证明HER2靶点已经丢失", "D": "按CA19-9回升直接判定RECIST进展并加药"}}, {"id": "Q4", "type": "不良反应管理", "phase": "血液学毒性复评", "timepoint": "原文报告2级白细胞减少及贫血", "question": "T-DXd治疗后，病例报告2级白细胞减少和贫血，但未提供当前ANC、血小板计数及是否发热。决定下一次给药及是否使用升白支持前，应首先核对什么？", "options": {"A": "把白细胞减少等同于发热性中性粒细胞减少", "B": "仅凭2级白细胞减少即永久停用T-DXd", "C": "无论ANC和感染情况如何，固定常规使用G-CSF", "D": "ANC、血红蛋白、发热感染及恢复趋势，按具体毒性调整"}}, {"id": "Q5", "type": "不良反应管理", "phase": "T-DXd治疗监测", "timepoint": "制定后续随访及患者教育时", "question": "拟制定T-DXd治疗期间的呼吸系统风险预案，当前未记录ILD。哪项安排最恰当？", "options": {"A": "新发咳嗽或呼吸困难及时评估并暂停疑似相关用药；确诊症状性ILD需永久停药", "B": "仅在血氧显著下降时检查，轻度咳嗽不影响用药", "C": "症状性ILD缓解后均按原剂量恢复T-DXd", "D": "出现任何咳嗽均直接诊断ILD，不排查感染与肿瘤进展"}}]}, {"case_id": "CASE-C54DD4A4", "title": "乳腺癌术后多年出现膝痛", "initial_information": "63岁女性，乳腺癌治疗19年后出现持续右膝疼痛及跛行，影像显示髌骨溶骨性病变。", "question_count": 5, "questions": [{"id": "Q1", "type": "诊断与分期", "phase": "晚期复发鉴别", "timepoint": "19年后出现髌骨溶骨病变时", "question": "既往乳腺癌患者出现持续膝痛及髌骨溶骨性病变，间隔已19年。下一步诊断策略应如何选择？", "options": {"A": "因髌骨部位罕见，未经分期即按原发骨肉瘤广泛切除", "B": "评估全身病变并在安全可行时取样，鉴别转移、原发骨病变及其他原因", "C": "按复发间隔较长排除乳腺来源，仅给予关节炎治疗", "D": "以PET摄取强度独立确定乳腺来源后开始系统治疗"}}, {"id": "Q2", "type": "分子诊断", "phase": "骨标本受体复核", "timepoint": "髌骨活检ER/PR强阳性后", "question": "髌骨标本ER/PR强阳性、Ki-67＜5%，HER2结果未提供。用于系统治疗前，最恰当的补充核对是？", "options": {"A": "由低Ki-67直接推定HER2阴性，按Luminal A完成分型", "B": "将免疫组化结果改记为已证实体细胞突变", "C": "不考虑标本处理差异，仅按19年前受体状态确定分型", "D": "核对HER2及骨标本脱钙处理对检测的影响，不补写HER2阴性"}}, {"id": "Q3", "type": "诊断与分期", "ph
