评估可切除性。",guidelineRef:{evidence_type:"指南",doc_id:"65dca43b-7ca8-48fc-a336-b4ab88dbd5e2",split_index:315,type:"guideline",authority:"CACA",source_title:"食管癌整合诊治指南（第二版）",source_version:"2024",source_section:"第二节 转化治疗要点",source_url:"",evidence_summary:"指南指出：cT4b/M1（M1主要指锁骨上淋巴结转移）属于转化治疗指征；应充分评估患者身体状况，进行诱导化疗联合/不联合免疫治疗或放化疗；在至少两个周期的诱导治疗结束后3~4周进行增强胸腹CT或PET/CT等评估，若肿瘤退缩评估后可切除，则进行手术治疗。"}},{id:"Q2",type:"分期",phase:"分期",timepoint:"当前教学复盘：2021年2月24日初诊分期评估",question:"该患者为60岁男性，病理证实食管中下段鳞癌；增强CT示长段食管病变、周围脂肪间隙消失，右侧锁骨上区约2.7 cm可疑转移淋巴结，AJCC第8版初始分期记为cT4bN0M1 IVB期。若仅依据《中国可切除食管癌围手术期诊疗实践指南（2023版）》对锁骨上区淋巴结属性的描述，以下哪项最准确？",options:["AJCC第8版已将其归为M1，因此其肿瘤学意义与肝、肺等远隔器官转移完全等同","该指南虽承认其归属尚存争议，但推荐将胸段食管癌的锁骨上区淋巴结视为区域淋巴结，并指出其与其他远隔器官转移的长期预后存在显著差异","对于食管胃交界部癌而言锁骨上区淋巴结属于远隔转移，因此该胸段食管鳞癌患者也必须按远隔转移处理","由于AJCC第8版将其归为M1，该指南认为胸段食管癌的锁骨上区淋巴结不应被视为区域淋巴结"],answer:1,answer_text:"该指南虽承认其归属尚存争议，但推荐将胸段食管癌的锁骨上区淋巴结视为区域淋巴结，并指出其与其他远隔器官转移的长期预后存在显著差异",explain:"该指南明确说明，锁骨上区淋巴结是否能够作为颈段及胸段食管癌的区域淋巴结尚存争议，但推荐将其视为颈段及胸段食管癌的区域淋巴结；同时指出其虽被AJCC第8版归为远隔转移，但在外科角度可及，且与其他远隔器官转移的长期预后具有显著差异。本例为胸段食管鳞癌，不是食管胃交界部癌，因此不能把食管胃交界部癌的M1判断直接套用为本例的确定性结论。选项A将M1与脏器转移的肿瘤学意义完全等同，选项C错误迁移了食管胃交界部癌规则，选项D与指南表述相反。该指南发表于2023年，晚于初诊时间，本题采用当前教学复盘方式使用。",keyPoint:"同一枚锁骨上区淋巴结在AJCC第8版分期属性与围手术期指南中的区域淋巴结判断之间可能不一致，必须区分胸段食管癌与食管胃交界部癌，不能把M1机械等同于其他远隔脏器转移。",guidelineRef:{evidence_type:"指南",doc_id:"97b21876-ef50-4b60-bd03-ab43b5724dad",split_index:11,type:"guideline",authority:"国家癌症中心, 中国医师协会胸外科医师分会, 中华医学会胸心血管外科学分会",source_title:"中国可切除食管癌围手术期诊疗实践指南（2023版）",source_version:"2023",source_section:"（二）术前诊断及临床分期",source_url:"",evidence_summary:"指南指出：锁骨上区淋巴结是否能够作为颈段及胸段食管癌的区域淋巴结尚存争议；对于食管胃交界部癌而言则归为远隔转移。尽管UICC/AJCC第8版将其视为远隔转移，但其在外科角度可及，并且与其他远隔器官转移的长期预后具有显著差异，因此推荐将其视为颈段及胸段食管癌的区域淋巴结。"}},{id:"Q3",type:"治疗",phase:"术后管理",timepoint:"当前教学复盘：2021年5月25日术后病理回报后辅助策略制定",question:"该患者接受白蛋白紫杉醇+卡铂+卡瑞利珠单抗转化治疗后行根治性切除，术后病理为ypT3N0M0 II期、TRS 2、切缘阴性，随后进入帕博利珠单抗联合个体化新抗原疫苗辅助治疗。根据《食管鳞癌术后随访中国胸外科专家共识》相关段落，下列关于证据适用边界的描述哪项最准确？",options:["该共识指出2021年CSCO指南推荐术后辅助免疫治疗用于新辅助放化疗+根治术后食管癌，但同时说明食管鳞癌围术期免疫治疗后复发转移模式尚不明确、暂不讨论，因此不能将这一推荐直接外推为本例新辅助免疫化疗后疫苗联合方案的标准依据","该共识明确推荐新辅助免疫化疗后非pCR患者术后采用帕博利珠单抗联合个体化新抗原疫苗","因围术期免疫治疗复发转移模式尚不明确，该共识认定术后任何免疫治疗或临床研究均不可开展","新辅助化疗联合免疫治疗患者病理缓解率较高，可直接套用新辅助放化疗后辅助免疫治疗的所有证据"],answer:0,answer_text:"该共识指出2021年CSCO指南推荐术后辅助免疫治疗用于新辅助放化疗+根治术后食管癌，但同时说明食管鳞癌围术期免疫治疗后复发转移模式尚不明确、暂不讨论，因此不能将这一推荐直接外推为本例新辅助免疫化疗后疫苗联合方案的标准依据",explain:"该共识明确指出，2021年CSCO指南推荐术后辅助免疫治疗应用于新辅助放化疗+根治术后食管癌患者；同时指出，涉及食管鳞癌围术期免疫治疗的患者根治性术后复发转移模式尚不明确，故本共识暂不讨论。因此，新辅助放化疗后辅助免疫治疗这一推荐不能被直接外推为本例新辅助免疫化疗后帕博利珠单抗联合个体化新抗原疫苗的标准依据。病例记录中该疫苗联合治疗属于前瞻性、单臂、探索性IIT，但这是研究性质说明，不是该共识的推荐。选项B将研究方案误写为指南推荐，选项C过于绝对，选项D混淆了既往治疗模式。",keyPoint:"标准辅助免疫治疗适应证来自新辅助放化疗后场景，不能跨模式外推到新辅助免疫化疗后的疫苗联合探索性治疗；证据不足时应明确研究性质与标准推荐的边界。",guidelineRef:{evidence_type:"指南",doc_id:"b4f3cff1-5ba1-4bb3-ba5b-29d202cdcde3",split_index:29,type:"guideline",authority:"中国医师协会胸外科医师分会",source_title:"食管鳞癌术后随访中国胸外科专家共识",source_version:"2021",source_section:"5 总结与展望",source_url:"",evidence_summary:"共识指出：2021年CSCO指南推荐术后辅助免疫治疗应用于新辅助放化疗+根治性术后食管癌患者；但目前涉及食管鳞癌围术期免疫治疗的患者根治性术后复发转移模式尚不明确，故本共识暂不讨论。"}},{id:"Q4",type:"不良反应",phase:"不良反应管理",timepoint:"2023年7月10日依托泊苷联合顺铂一周期后",question:"该患者因复发后表型转化倾向接受依托泊苷联合顺铂1周期，随后出现重度骨髓抑制及全身状况恶化，无法继续化疗。仅依据该病例原始记录，以下哪项解读最准确？",options:["病例已明确为CTCAE 4级骨髓抑制，因此必须永久停用原方案","病例只描述“重度骨髓抑制及全身状况恶化”，未提供CTCAE分级或中性粒细胞、血小板、血红蛋白等关键数值，因此不能据此确定具体级别或直接套用某一级别的确定性处理规则","病例没有记录发热性中性粒细胞减少，因此可排除感染风险","全身状况恶化已足以替代骨髓抑制分级，可确定后续应减量继续原方案"],answer:1,answer_text:"病例只描述“重度骨髓抑制及全身状况恶化”，未提供CTCAE分级或中性粒细胞、血小板、血红蛋白等关键数值，因此不能据此确定具体级别或直接套用某一级别的确定性处理规则",explain:"原始资料仅记录依托泊苷联合顺铂1周期后出现重度骨髓抑制和全身状况恶化，未给出CTCAE具体分级，也未提供中性粒细胞、血小板、血红蛋白或发热性中性粒细胞减少等实验室数据。因此，不能自行将“重度”等同于G3或G4，也不能据此确定永久停药、减量恢复或再挑战。本题仅考查病例已有信息边界，不进行通用管理推荐。",keyPoint:"临床教学中应区分“病例描述了严重毒性”与“已具备足够数据完成CTCAE分级并作出确定性处理决策”；缺少关键实验室和分级信息时，结论只能停留于信息不足。",guidelineRef:{evidence_type:"病例事实",doc_id:"",split_index:null,type:"",authority:"",source_title:"脱敏病例：食管鳞癌转化治疗、探索性疫苗辅助与神经内分泌分化的全程管理",source_version:"",source_section:"",source_url:"",evidence_summary:"病例记录：依托泊苷联合顺铂1周期后出现重度骨髓抑制及全身状况恶化，无法继续化疗；材料未提供CTCAE具体分级，也未提供中性粒细胞、血小板、血红蛋白或发热性中性粒细胞减少等结果。"}},{id:"Q5",type:"病理评估",phase:"病理评估",timepoint:"2023年6月14日复发灶穿刺病理回报后",question:"该患者复发灶穿刺病理报告：p40(+)、p53(+)、p63(+)、CK5/6(-)、CgA少量(+)、Syn少量(+)、CD56部分(+)、TTF-1(-)、CK(Pan)少量(+)、Ki-67约85%、Rb未缺失/表达保留；原始病理措辞为“倾向鳞状细胞癌伴神经内分泌分化”。以下哪项解读最符合该病例？",options:["存在可确诊小细胞神经内分泌癌的全套神经内分泌癌特征","Ki-67达85%且出现神经内分泌标志物表达，即可排除鳞癌背景并确诊疾病转化为小细胞癌","仍以鳞癌背景为主，仅表现为部分神经内分泌分化，不能据此升级为纯小细胞神经内分泌癌","TTF-1阴性可确诊为肺源性小细胞癌转移"],answer:2,answer_text:"仍以鳞癌背景为主，仅表现为部分神经内分泌分化，不能据此升级为纯小细胞神经内分泌癌",explain:"该患者复发灶仍表达p40、p53、p63等鳞癌标志物，神经内分泌标志物CgA、Syn仅少量阳性，CD56为部分阳性，且Rb表达未缺失/保留。原始病理措辞也仅是“倾向鳞状细胞癌伴神经内分泌分化”，并未给出确定性神经内分泌癌或小细胞癌诊断。因此不能仅凭Ki-67升高和少量神经内分泌标志物表达就升级为纯小细胞神经内分泌癌。选项A、B属于过度解读；选项D中TTF-1阴性也不足以证明为肺源性转移。",keyPoint:"鳞癌背景下的部分神经内分泌标志物表达和高增殖指数，不等于确定性小细胞神经内分泌癌转化，病理层级必须结合谱系标志物和原始诊断措辞。",guidelineRef:{evidence_type:"病例事实",doc_id:"",split_index:null,type:"",authority:"",source_title:"脱敏病例：食管鳞癌转化治疗、探索性疫苗辅助与神经内分泌分化的全程管理",source_version:"",source_section:"",source_url:"",evidence_summary:"病例病理记录：复发灶p40(+)、p53(+)、p63(+)、CK5/6(-)、CgA少量(+)、Syn少量(+)、CD56部分(+)、TTF-1(-)、CK(Pan)少量(+)、Ki-67约85%、Rb未缺失/表达保留；原始病理措辞为“倾向鳞状细胞癌伴神经内分泌分化”。"}}],Y3={generation_status:U3,question_count:q3,difficulty:L3,questions:B3},G3="success",Q3=5,X3="进阶",K3=[{id:"Q1",type:"治疗",phase:"不良反应管理",timepoint:"当前教学复盘：术后继续原方案1周期后出现G4 ICI相关1型糖尿病并DKA时",question:"当前教学复盘：该患者术后继续SOX联合曲妥珠单抗和帕博利珠单抗1周期后，出现G4免疫检查点抑制剂相关1型糖尿病并糖尿病酮症酸中毒，表现为严重高血糖、酸中毒、酮体阳性、C肽极低。此时下列哪项处理最符合指南？",options:["暂停帕博利珠单抗，住院，完成DKA评估，在内分泌团队指导下给予静脉液体、补钾和胰岛素治疗","继续帕博利珠单抗，门诊口服二甲双胍并定期监测血糖","立即给予大剂量糖皮质激素以逆转胰岛β细胞损伤","继续抗肿瘤治疗，门诊皮下注射胰岛素并在下一次给药时复查血糖"],answer:0,answer_text:"暂停帕博利珠单抗，住院，完成DKA评估，在内分泌团队指导下给予静脉液体、补钾和胰岛素治疗",explain:"该患者为G4免疫检查点抑制剂相关1型糖尿病并DKA，C肽极低提示严重胰岛素缺乏。NCCN毒性管理指南明确指出，DKA需要住院并暂停免疫治疗，管理应包括静脉液体伴或不伴补钾、静脉胰岛素，并动态监测血糖、血酮、pH和阴离子间隙；糖皮质激素不推荐用于逆转ICI相关1型糖尿病。门诊口服降糖药、继续ICI及单用皮下胰岛素均不符合DKA急症管理原则。",keyPoint:"G4 ICI相关1型糖尿病并DKA属于内分泌急症，核心处理是暂停ICI、住院、DKA评估与胰岛素治疗，不能用糖皮质激素逆转胰岛素缺乏。",guidelineRef:{evidence_type:"指南",doc_id:"7ba9cbc8-7452-462e-8b32-63b3c19da4c7",split_index:178,type:"guideline",authority:"NCCN",source_title:"NCCN Clinical Practice Guidelines in Oncology (NCCN Guidelines®) Management of Immune Checkpoint Inhibitor-Related Toxicities",source_version:"2026",source_section:"Hyperglycemia/Diabetes",source_url:"",evidence_summary:"DKA requires hospitalization and immunotherapy hold; management may include IV fluids with or without potassium supplementation, IV insulin, and hourly testing of glucose, serum ketones, blood pH, and anion gap. Corticosteroid therapy is not recommended for treating T1DM."}},{id:"Q2",type:"治疗",phase:"不良反应管理",timepoint:"当前教学复盘：DKA纠正、血糖稳定且同期存在G3 ICI相关间质性肺炎时",question:"当前教学复盘：该患者G4免疫检查点抑制剂相关1型糖尿病所致DKA经胰岛素治疗后酸中毒已纠正、血糖稳定；但同期仍存在G3免疫检查点抑制剂相关间质性肺炎。关于后续帕博利珠单抗再挑战，下列哪项最符合指南？",options:["可立即重启ICI，因为DKA已纠正且血糖稳定","永不考虑重启ICI，因为存在G3~4免疫相关性肺炎","可将帕博利珠单抗减量后重启","待肺炎完全消退且停用糖皮质激素后即可重启"],answer:1,answer_text:"永不考虑重启ICI，因为存在G3~4免疫相关性肺炎",explain:"该题需要综合两种irAE的再挑战边界。CSCO毒性管理指南注释显示，1型糖尿病伴酮症酸中毒者在酸中毒纠正、血糖稳定后可以重启ICI；但肺部出现严重或危及生命的肺炎（G3~4）时，永不考虑重启ICI。该患者虽然DKA已纠正，但同时存在G3免疫相关性肺炎，因此整体上不能重启。选项D描述的是G2肺炎消退至≤G1且已停用糖皮质激素或仅用泼尼松≤10 mg时的情形，不适用于G3~4肺炎。",keyPoint:"ICI再挑战必须综合所有irAE判断；单一内分泌毒性恢复不能覆盖同期G3~4免疫相关性肺炎的永久停用规则。",guidelineRef:{evidence_type:"指南",doc_id:"1a5c4240-bad9-4448-ab64-9b705a3ad087",split_index:208,type:"guideline",authority:"CSCO",source_title:"中国临床肿瘤学会（CSCO）免疫检查点抑制剂相关的毒性管理指南 2023",source_version:"2023",source_section:"",source_url:"",evidence_summary:"注释显示：1型糖尿病伴酮症酸中毒者，在酸中毒得以纠正且血糖恢复稳定后，可以重启ICIs治疗；肺部出现严重或危及生命的肺炎（G3~4），永不考虑重启ICIs治疗。"}},{id:"Q3",type:"不良反应",phase:"不良反应管理",timepoint:"当前教学复盘：确诊G4 ICI相关1型糖尿病并DKA后",question:"当前教学复盘：该患者出现G4免疫检查点抑制剂相关1型糖尿病并DKA，C肽极低。关于该糖尿病的性质和后续长期管理，以下哪项正确？",options:["属于短暂性高血糖，停用ICI后胰岛功能可完全恢复","属于几乎不可逆的胰岛素缺乏，需长期胰岛素替代，糖皮质激素不能逆转胰岛β细胞损伤","应首选大剂量糖皮质激素以恢复胰岛功能","因自身抗体阴性者可排除ICI相关1型糖尿病"],answer:1,answer_text:"属于几乎不可逆的胰岛素缺乏，需长期胰岛素替代，糖皮质激素不能逆转胰岛β细胞损伤",explain:"该患者C肽极低并发生DKA，符合ICI诱导糖尿病的典型特征。CACA内分泌保护指南指出，ICI诱导的糖尿病表现为严重且持续的胰岛素缺乏，多数患者起病时C肽水平低或检测不出，几乎无残存胰岛功能，需要依赖胰岛素治疗；疾病几乎不可逆，且糖皮质激素不能逆转细胞功能障碍。虽然49%患者存在胰岛自身抗体，但抗体阳性并非诊断必需，因此不能因自身抗体阴性排除。",keyPoint:"ICI相关1型糖尿病几乎不可逆，需长期胰岛素替代，糖皮质激素无效；诊断不依赖胰岛自身抗体阳性。",guidelineRef:{evidence_type:"指南",doc_id:"a0ceb1ac-d0eb-45fa-b51a-ab92d462333c",split_index:38,type:"guideline",authority:"CACA",source_title:"中国肿瘤整合诊治技术指南（CACA） 内分泌保护",source_version:"2023",source_section:"6.免疫治疗相关性高血糖",source_url:"",evidence_summary:"免疫检查点抑制剂诱导的糖尿病表现为严重且持续的胰岛素缺乏；多数患者起病时C肽水平低或检测不出，几乎无残存胰岛功能，需要依赖胰岛素治疗；几乎不可逆且类固醇激素治疗不能逆转细胞功能障碍；49%存在胰岛自身抗体阳性。"}},{id:"Q4",type:"疗效评估",phase:"疗效评估",timepoint:"完成3周期联合治疗后、术前疗效评估时",question:"该患者完成3周期SOX联合曲妥珠单抗和帕博利珠单抗后，增强CT提示原发灶及淋巴结明显缩小，疗效评价为PR/cPR。此时下列哪项结论最准确？",options:["已可确认达到病理完全缓解（pCR）","已可确认术后病理为ypT1bN0M0","影像学显示明显退缩，但尚无术后病理结果，不能据此判断pCR","已可确认No.16a2/16b1腹主动脉旁淋巴结转移完全消失"],answer:2,answer_text:"影像学显示明显退缩，但尚无术后病理结果，不能据此判断pCR",explain:"该时间点为完成3周期联合治疗后、手术前，仅能获得增强CT的PR/cPR结果。手术尚未进行，术后病理尚不存在，因此不能确认pCR、ypT1bN0M0或No.16a2/16b1淋巴结病理状态。影像学缓解提示肿瘤负荷明显退缩，但不能替代术后病理学评估。",keyPoint:"疗效评估应严格遵守时间顺序，区分影像学缓解与病理学缓解，不能以术后病理倒推术前判断。",guidelineRef:{evidence_type:"病例事实",doc_id:"",split_index:null,type:"",authority:"",source_title:"HER2过表达晚期胃癌转化治疗、根治手术与重度免疫毒性的全程管理",source_version:"",source_section:"",source_url:"",evidence_summary:"病例时间线显示：患者完成SOX联合曲妥珠单抗和帕博利珠单抗3周期后，增强CT提示原发灶及淋巴结明显缩小，评价PR/cPR；此时手术尚未进行，无术后病理结果。"}},{id:"Q5",type:"病理评估",phase:"手术病理",timepoint:"术后病理报告后",question:"该患者行全胃切除、D2淋巴结清扫及腹主动脉旁淋巴结清扫后，术后病理示TRG 1、ypT1bN0M0，清扫淋巴结0/80。关于初诊时No.16a2/16b1腹主动脉旁淋巴结影像学疑转移与术后病理结果的关系，下列哪项最恰当？",options:["0/80淋巴结阴性可以证明初诊时No.16a2/16b1一定不是转移","初诊时No.16a2/16b1为影像学疑转移，术后0/80并不能将其改写为病理证实或排除","0/80淋巴结阴性等同于No.16a2/16b1病理完全缓解","术后ypT1bN0M0可倒推初诊分期为I期"],answer:1,answer_text:"初诊时No.16a2/16b1为影像学疑转移，术后0/80并不能将其改写为病理证实或排除",explain:"病例资料明确记录初诊时No.16a2/16b1仅为影像学疑转移，并非病理证实转移。术后0/80淋巴结未见癌转移是术后病理结果，但未提供腹主动脉旁阳性淋巴结具体站点及其与初诊可疑淋巴结的对应关系，因此不能用其追溯将初诊影像学疑转移改写为病理证实或排除。选项A、C属于过度推断，选项D以术后病理倒推初诊分期不符合时间顺序。",keyPoint:"影像学疑转移与病理学淋巴结状态是不同层面的证据，不能用后续清扫淋巴结阴性倒推改写初诊影像学疑转移。",guidelineRef:{evidence_type:"病例事实",doc_id:"",split_index:null,type:"",authority:"",source_title:"HER2过表达晚期胃癌转化治疗、根治手术与重度免疫毒性的全程管理",source_version:"",source_section:"",source_url:"",evidence_summary:"病例资料显示：初诊No.16a2/16b1为影像学疑转移；术后病理示TRG 1、ypT1bN0M0，清扫淋巴结0/80未见癌转移，未提供初诊可疑淋巴结站点与术后病理的对应关系。"}}],w3={generation_status:G3,question_count:Q3,difficulty:X3,questions:K3},J3="success",$3=5,F3="进阶",W3=[{id:"Q1",type:"治疗",phase:"二线治疗",timepoint:"当前教学复盘：回顾2021年9月全脑放疗决策时点",question:"患者为ROS1融合阳性IVB期肺腺癌伴脑转移，2021年9月塞瑞替尼治疗期间出现颅脑病灶进展，但颅外病变控制稳定。结合当前教学复盘，最符合指南的处理策略是？",options:["继续原ROS1-TKI并联合适当的局部治疗","继续原ROS1-TKI单药，不联合局部治疗","停用原ROS1-TKI，更换为含铂双药化疗","停用原ROS1-TKI，更换为含铂双药化疗并联合局部治疗"],answer:0,answer_text:"继续原ROS1-TKI并联合适当的局部治疗",explain:"该患者属于ROS1-TKI治疗期间出现颅脑进展、颅外病变控制稳定的场景，对应指南中的寡进展或CNS进展分层，推荐策略为原TKI治疗联合局部治疗。全脑放疗只是本病例实际采用的局部治疗方式，不是该指南片段指定的唯一局部治疗。继续原TKI但不联合局部治疗不能处理已出现的颅脑进展，单纯停用TKI更换化疗不适合该进展模式，停用原TKI并联合局部治疗也不符合该分层下最直接对应的指南推荐。",keyPoint:"ROS1-TKI治疗期间出现CNS或寡进展且颅外稳定时，核心指南策略是保留原TKI并联合适当局部治疗；局部治疗方式不应被写成指南唯一指定。",guidelineRef:{evidence_type:"指南",doc_id:"065ff4dc-ec1b-442e-8381-e8d820673576",split_index:41,type:"guideline",authority:"CSCO",source_title:"中国临床肿瘤学会（CSCO）非小细胞肺癌诊疗指南 2026",source_version:"2026",source_section:"",source_url:"",evidence_summary:"该指南IV期ROS1融合NSCLC二线治疗表中，寡进展或CNS进展时I级推荐为原TKI治疗+局部治疗[2A类]。"}},{id:"Q2",type:"治疗",phase:"后线治疗",timepoint:"当前教学复盘：回顾2022年8月广泛进展时点",question:"患者ROS1融合阳性IVB期肺腺癌，曾接受塞瑞替尼及APG-2449治疗后，2022年8月出现脑部及肺部病灶广泛进展。当时患者拒绝再次活检，且后续ROS1抑制剂可及性有限。结合当前教学复盘，对该非鳞癌患者最合理的系统治疗是？",options:["继续APG-2449并联合局部放疗","含铂双药化疗联合或不联合贝伐珠单抗","继续APG-2449单药","克唑替尼单药"],answer:1,answer_text:"含铂双药化疗联合或不联合贝伐珠单抗",explain:"该患者已接受多线ROS1抑制剂后出现广泛进展，不属于单纯CNS或寡进展，因此继续APG-2449联合局部放疗或继续APG-2449单药均不足以控制系统性进展。指南治疗推荐表中，ROS1融合NSCLC广泛进展时列出含铂双药化疗或含铂双药化疗+贝伐珠单抗，尤其适用于非鳞癌患者。克唑替尼在多线ROS1抑制剂耐药后缺乏直接支持。",keyPoint:"ROS1融合阳性NSCLC在多个ROS1-TKI治疗后广泛进展且再次活检不可及时，含铂双药化疗±贝伐珠单抗是指南支持的后续系统治疗。",guidelineRef:{evidence_type:"指南",doc_id:"c2dca4fe-a78d-4265-a981-75684823baad",split_index:77,type:"guideline",authority:"中国中西医结合学会",source_title:"肺癌中西医结合诊疗指南",source_version:"2024",source_section:"",source_url:"",evidence_summary:"该指南治疗推荐表中，ROS1融合NSCLC广泛进展时列出：含铂双药化疗或含铂双药化疗+贝伐珠单抗。"}},{id:"Q3",type:"治疗",phase:"初始治疗",timepoint:"当前教学复盘：回顾2020年9月初诊时点",question:"患者为50岁女性、无吸烟史，ROS1融合阳性右肺腺癌伴脑及多发淋巴结转移，T4N3M1c、IVB期，PS 1。2020年9月初诊时尚未接受过全身抗肿瘤治疗。结合当前教学复盘，根据指南，以下哪项最符合该患者初始全身治疗的一线推荐？",options:["克唑替尼或恩曲替尼","塞瑞替尼","含铂双药化疗联合或不联合贝伐珠单抗","单纯全脑放疗"],answer:0,answer_text:"克唑替尼或恩曲替尼",explain:"指南在ROS1阳性晚期NSCLC一线治疗中一致推荐克唑替尼或恩曲替尼；含铂双药化疗±贝伐珠单抗属于存在分歧的可考虑选项，并非最符合一线推荐。塞瑞替尼未在该指南此处列为一致推荐；单纯全脑放疗只能处理颅内病变，不能作为驱动基因阳性IVB期肺腺癌的全身初始治疗。",keyPoint:"ROS1融合阳性晚期NSCLC初始全身治疗应优先选择指南一致推荐的ROS1-TKI，而不是将可考虑化疗或局部放疗当作首选。",guidelineRef:{evidence_type:"指南",doc_id:"fd357ad4-e149-4a6f-b624-009a1351acad",split_index:77,type:"guideline",authority:"CACA",source_title:"肺癌",source_version:"2024",source_section:"",source_url:"",evidence_summary:"该指南在ROS1阳性一线治疗部分写明：一致推荐使用克唑替尼或恩曲替尼；可考虑使用含铂双药化疗±贝伐珠单抗（存在分歧但推荐）。"}},{id:"Q4",type:"疗效评估",phase:"再次活检",timepoint:"2023年8月15日再次活检后",question:"患者2023年8月15日再次活检后，若仅依据病例材料，以下哪项描述是正确的？",options:["再次活检同时检出ROS1 D869Y和TP53 L257_E258delinsQ，且报告支持CD74-ROS1融合仍存在","再次活检同时检出ROS1 D869Y和TP53 L257_E258delinsQ，但报告未提及CD74-ROS1融合是否仍存在","再次活检同时检出ROS1 D869Y和TP53 L257_E258delinsQ，并提示TP53变异在初始样本中已有记录","再次活检结果支持ROS1 D869Y与CD74-ROS1融合同时检出，TP53变异状态尚需进一步确认"],answer:1,answer_text:"再次活检同时检出ROS1 D869Y和TP53 L257_E258delinsQ，但报告未提及CD74-ROS1融合是否仍存在",explain:"病例材料明确记录2023年8月15日再次活检检出TP53 L257_E258delinsQ（丰度8.13%）和ROS1 D869Y（丰度3.84%），因此可以确认这两个变异在该次报告中同时列出；但该报告未提及CD74-ROS1融合是否仍存在，因此不能确认融合状态是否保持或消失。选项0、3均加入了报告未提供的融合状态判断，选项2将TP53变异认定为初始样本已有记录，均超出当前材料支持范围。对ROS1 D869Y的功能或治疗相关性，本材料未给出结论。",keyPoint:"解读再次活检结果时，应区分初始驱动融合与后续获得性变异，并避免在病例未明确报告时自行推断融合状态。",guidelineRef:{evidence_type:"病例事实",doc_id:"",split_index:null,type:"",authority:"",source_title:"ROS1融合阳性晚期肺腺癌全程精准治疗病例",source_version:"",source_section:"",source_url:"",evidence_summary:"病例记录2023年8月15日再次活检检出TP53 L257_E258delinsQ（丰度8.13%）和ROS1 D869Y（丰度3.84%），未提及是否仍存在CD74-ROS1融合。"}},{id:"Q5",type:"治疗",phase:"后线治疗",timepoint:"2023年9月准备参加JYP0322 I期临床研究时",question:"2023年9月，患者在多线治疗进展后准备参加JYP0322 I期临床研究。仅依据该时点前病例材料，以下哪项关于该决定的证据边界最准确？",options:["病例记录其准备参加JYP0322 I期研究，但不能据此认为该药在当时已是标准治疗。","病例记录JYP0322为新一代选择性ROS1抑制剂，因此可将其视为该时点的标准治疗。","患者多线治疗进展且后线ROS1抑制剂可及性受限，说明参加该研究优于其他可选治疗。","患者此前已接受化疗和放疗，因
