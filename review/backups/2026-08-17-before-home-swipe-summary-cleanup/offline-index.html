b4ab88dbd5e2",split_index:314,type:"guideline",authority:"CACA",source_title:"食管癌整合诊治指南（第二版）",source_version:"2024",source_section:"第一节 概述",source_url:"",evidence_summary:"指南将转化治疗定义为对因邻近器官侵犯或远处转移而初始无法切除的食管癌进行治疗干预，使其获得根治性手术或放化疗机会；转化手术是诱导治疗后争取R0切除的治疗。"}},{id:"Q2",type:"疗效复评",phase:"转化治疗后评估",timepoint:"当前教学复盘：完成2周期转化治疗并获得影像学PR时",question:"患者完成2周期转化治疗后症状改善，原发灶及锁骨上淋巴结明显缩小，影像学评价PR。下列关于下一步决策的说法正确的是？",options:["影像学PR已经等同于可切除，应直接安排手术而无需系统复评","必须固定完成6周期治疗后才能进行任何可切除性评估","应在诱导治疗结束后进行增强胸腹CT或PET/CT等复评，确认肿瘤退缩后达到可切除条件再考虑手术","初诊记录为IVB期，因此无论治疗反应如何均不得考虑手术"],answer:2,answer_text:"应在诱导治疗结束后进行增强胸腹CT或PET/CT等复评，确认肿瘤退缩后达到可切除条件再考虑手术",explain:"指南要求在至少2周期诱导治疗结束后3至4周，以增强胸腹CT或PET/CT等进行疾病评估；只有肿瘤退缩并经评估达到可切除条件时才进入手术。影像学PR是复评的重要信息，但不能单独替代可切除性判断。该指南版本晚于病例治疗时间，本题用于当前教学复盘。",keyPoint:"转化治疗后的手术决策必须经过规范影像复评和可切除性判断，影像学缓解本身不等同于已经适合手术。",guidelineRef:{evidence_type:"指南",doc_id:"65dca43b-7ca8-48fc-a336-b4ab88dbd5e2",split_index:315,type:"guideline",authority:"CACA",source_title:"食管癌整合诊治指南（第二版）",source_version:"2024",source_section:"第二节 转化治疗要点",source_url:"",evidence_summary:"指南建议至少2周期诱导治疗结束后3至4周进行增强胸腹CT或PET/CT等疾病评估；肿瘤退缩且评估可切除时进行手术，并以R0切除为目标。"}},{id:"Q3",type:"证据适用性",phase:"术后管理",timepoint:"当前教学复盘：根治性切除后拟定辅助治疗时",question:"患者在新辅助免疫化疗后接受根治性切除，术后拟参加帕博利珠单抗联合个体化新抗原疫苗的前瞻性探索性IIT。下列对该方案证据定位的说法正确的是？",options:["现有共识不能将该联合方案视为标准辅助治疗，应明确其探索性研究属性并充分知情同意","只要术后仍有肿瘤残余，该联合方案就是正式指南推荐的标准治疗","围术期免疫治疗证据尚不完善，说明任何相关临床研究均不应开展","患者后来获得较长无病生存即可反向证明该联合方案适用于所有同类患者"],answer:0,answer_text:"现有共识不能将该联合方案视为标准辅助治疗，应明确其探索性研究属性并充分知情同意",explain:"共识提到的术后辅助免疫治疗推荐对应新辅助放化疗后根治性手术的场景，同时明确食管鳞癌围术期免疫治疗后复发转移模式尚不明确，暂不讨论。因此，不能把该段证据直接外推为新辅助免疫化疗后帕博利珠单抗联合个体化疫苗的标准依据。本例方案应按探索性IIT呈现，不能用单例结局反向证明通用疗效。",keyPoint:"证据适用性取决于既往治疗模式和研究场景；探索性IIT必须与正式指南推荐的标准辅助治疗清楚区分。",guidelineRef:{evidence_type:"指南",doc_id:"b4f3cff1-5ba1-4bb3-ba5b-29d202cdcde3",split_index:29,type:"guideline",authority:"中国医师协会胸外科医师分会",source_title:"食管鳞癌术后随访中国胸外科专家共识",source_version:"2021",source_section:"5 总结与展望",source_url:"",evidence_summary:"共识指出，术后辅助免疫治疗的相关推荐对应新辅助放化疗后根治性手术患者；围术期免疫治疗患者术后复发转移模式尚不明确，本共识暂不讨论。"}},{id:"Q4",type:"复发管理",phase:"术后复发",timepoint:"当前教学复盘：术后首次出现上纵隔及锁骨上淋巴结复发时",question:"患者术后出现上纵隔及锁骨上淋巴结复发，病例资料尚不足以确认复发灶是否可切除。下列哪项最符合术后局部区域复发的治疗决策框架？",options:["无论复发灶是否可切除，均只需延续原系统治疗","无论既往是否接受放疗，均应直接实施同一放疗方案","只要是局部区域复发就必须手术，不再评估手术禁忌或放疗史","先评估复发灶可切除性及复发部位既往放疗情况，再分层选择根治性或挽救性手术、放化疗、放疗或系统治疗"],answer:3,answer_text:"先评估复发灶可切除性及复发部位既往放疗情况，再分层选择根治性或挽救性手术、放化疗、放疗或系统治疗",explain:"指南将术后局部区域复发按两个关键变量分层：是否可手术切除，以及复发部位是否既往接受过放疗。不同组合对应根治性或挽救性手术、同步放化疗、系统治疗联合放疗、单纯放疗或系统性药物治疗等不同路径。因此，在资料尚不足以确定可切除性时，不能直接指定唯一局部或全身方案。该指南版本晚于病例复发时间，本题用于当前教学复盘。",keyPoint:"术后局部区域复发的管理不是单一路径，必须结合可切除性和既往放疗史进行分层决策。",guidelineRef:{evidence_type:"指南",doc_id:"1f2a5a56-78cc-4461-bf80-9c54c600de20",split_index:114,type:"guideline",authority:"CSCO",source_title:"中国临床肿瘤学会（CSCO）食管癌诊疗指南 2026",source_version:"2026",source_section:"（3）术后药物治疗方案",source_url:"",evidence_summary:"指南将术后局部区域复发按是否可手术切除及复发部位既往是否接受放疗分层，并据此选择根治性或挽救性手术、同步放化疗、系统治疗联合放疗、单纯放疗或系统性药物治疗。"}},{id:"Q5",type:"再活检决策",phase:"再次进展",timepoint:"当前教学复盘：局部放疗后曾获缓解、随后再次进展且生物学行为改变时",question:"患者局部放疗后曾获得缓解，随后病灶再次增大且临床行为发生变化。在选择新的后线系统治疗前，下列哪项处理最合理？",options:["仅凭影像学进展推定已转化为小细胞癌，并立即按小细胞癌方案治疗","对可及进展病灶进行穿刺活检或其他有创取材，获得新的病理诊断后再制定后线方案","因为既往局部放疗曾有效，应继续原方案且无需重新评估","一次增强CT已经能够替代病理诊断，无需进行任何组织学确认"],answer:1,answer_text:"对可及进展病灶进行穿刺活检或其他有创取材，获得新的病理诊断后再制定后线方案",explain:"术后随访共识建议：影像学等无创检查考虑复发时，应通过EUS、经皮穿刺、淋巴结或浅表肿物活检等有创检查进一步取得病理诊断。对于本例再次进展并出现生物学行为变化的情况，先重新取材有助于确认复发性质和病理表型，避免仅凭影像或临床推测把“鳞癌伴神经内分泌分化”升级为已经证实的纯神经内分泌癌或小细胞癌。",keyPoint:"复发或再次进展时若病理性质会影响后线治疗，应尽可能重新获取组织学证据，避免用影像学推测替代病理确认。",guidelineRef:{evidence_type:"指南",doc_id:"b4f3cff1-5ba1-4bb3-ba5b-29d202cdcde3",split_index:7,type:"guideline",authority:"中国医师协会胸外科医师分会",source_title:"食管鳞癌术后随访中国胸外科专家共识",source_version:"2021",source_section:"3 随访方案",source_url:"",evidence_summary:"共识建议，影像学等无创检查考虑复发时，可通过EUS、经皮穿刺、淋巴结或浅表肿物活检等有创检查进一步获取病理诊断。"}}],Qs={generation_status:Ls,question_count:Bs,difficulty:Ys,questions:Gs},Xs="success",Ks=5,ws="进阶",Js=[{id:"Q1",type:"治疗决策",phase:"初始治疗",timepoint:"当前教学复盘：初始治疗决策时",question:"65 岁男性，IV 期胃低分化腺癌，HER2 IHC 3+ 且 FISH 扩增，PD-L1 CPS 5，MSS/pMMR，ECOG PS 1。按当前指南进行教学复盘，此时最适宜的一线系统治疗策略是？",options:["帕博利珠单抗联合曲妥珠单抗及含氟尿嘧啶类和铂类化疗","曲妥珠单抗联合含氟尿嘧啶类和铂类化疗","含氟尿嘧啶类和铂类化疗单药","帕博利珠单抗单药治疗"],answer:0,answer_text:"帕博利珠单抗联合曲妥珠单抗及含氟尿嘧啶类和铂类化疗",explain:"Ⅲ期研究 KEYNOTE-811 最终分析结果显示，一线曲妥珠单抗联合化疗中加入帕博利珠单抗显著改善 PD-L1 CPS ≥1 人群的 PFS 和 OS，上述“靶免化”模式获批用于治疗 HER2 高表达和 PD-L1 CPS ≥1 的不可切除或转移性食管胃结合部或胃腺癌患者。本病例 HER2 阳性且 CPS 5，符合该治疗人群。",keyPoint:"HER2 高表达且 PD-L1 CPS ≥1 的不可切除或转移性胃腺癌患者，一线推荐帕博利珠单抗联合曲妥珠单抗及化疗。",guidelineRef:{evidence_type:"指南",doc_id:"a67b5445-0dac-4ec4-a1ec-3d85f4849b6b",split_index:119,type:"guideline",authority:"CSCO",source_title:"中国临床肿瘤学会（CSCO）胃癌诊疗指南 2026",source_version:"2026",source_section:"",source_url:"",evidence_summary:"Ⅲ期研究 KEYNOTE-811 最终分析结果显示，一线曲妥珠单抗联合化疗中加入帕博利珠单抗显著改善 PD-L1 CPS ≥1 人群的 PFS 和 OS，上述“靶免化”模式获批用于治疗 HER2 高表达和 PD-L1 CPS ≥1 的不可切除或转移性食管胃结合部或胃腺癌患者。"}},{id:"Q2",type:"诊断策略",phase:"初始诊断",timepoint:"当前教学复盘：初诊时",question:"对于初诊 IV 期胃癌患者，为指导精准治疗分层，按当前共识进行教学复盘，初诊时推荐完善哪些关键分子检测？",options:["PD-L1 蛋白表达（CPS）、MMR/MSI、HER2、Claudin 18.2、EB 病毒等免疫组化及基因检测","仅检测 HER2 状态和 MMR/MSI 状态","仅检测 PD-L1 蛋白表达和 HER2 状态","无需分子检测，直接开始含氟尿嘧啶类和铂类化疗"],answer:0,answer_text:"PD-L1 蛋白表达（CPS）、MMR/MSI、HER2、Claudin 18.2、EB 病毒等免疫组化及基因检测",explain:"IV 期胃癌患者初诊时，推荐完善活检组织的相关免疫组织化学及基因检测，包括 PD-L1 蛋白表达水平、MMR/MSI、HER2、Claudin 18.2、EB 病毒等，以指导精准转化治疗。",keyPoint:"IV 期胃癌初诊应进行全面分子病理学评估，包括 PD-L1 CPS、MMR/MSI、HER2、Claudin 18.2、EB 病毒等。",guidelineRef:{evidence_type:"指南",doc_id:"4569a34f-9f0f-44e5-8b93-5f298ef949e7",split_index:18,type:"guideline",authority:"中华医学会外科学分会腹腔镜与内镜外科学组，中国抗癌协会胃癌专业委员会，中国抗癌协会腔镜与机器人外科分会，《中华消化外科杂志》编辑委员会",source_title:"精准外科胃癌转化治疗专家共识（2025 版）",source_version:"2025",source_section:"",source_url:"",evidence_summary:"推荐意见 7：IV 期胃癌患者初诊时，推荐完善活检组织的相关免疫组织化学及基因检测（PD-L1 蛋白表达水平、MMR/MSI、HER2、Claudin 18.2、EB 病毒等）。"}},{id:"Q3",type:"治疗决策",phase:"转化治疗后评估",timepoint:"当前教学复盘：转化治疗 3 周期后评估 PR 时",question:"患者接受 SOX 联合曲妥珠单抗和帕博利珠单抗治疗 3 周期后，增强 CT 提示原发灶及淋巴结明显缩小，评价 PR。依据当前共识进行教学复盘，此时关于手术决策的说法正确的是？",options:["不能仅凭影像学缓解直接手术，应重新进入 MDT 评估经综合治疗后是否可能实施根治性手术切除","影像学评价 PR 后即可直接进行手术切除，无需再次评估","必须继续原方案治疗至 6 周期后才可评估手术机会","IV 期胃癌无论治疗反应如何均不应考虑手术，直接改为姑息治疗"],answer:0,answer_text:"不能仅凭影像学缓解直接手术，应重新进入 MDT 评估经综合治疗后是否可能实施根治性手术切除",explain:"对于初诊评估为 cIV 期胃癌患者，经过 MDT 讨论，认为经综合治疗后有可能实施根治性手术切除者，可实施转化治疗。影像学缓解不等同于适合手术，需 MDT 综合评估转移范围、治疗反应、体能状态、手术风险和 R0 切除可能性后决策。",keyPoint:"cIV 期胃癌转化治疗后需经 MDT 综合评估制订后续治疗方案，判断是否可能实施根治性手术切除，而非仅凭影像学缓解直接决策。",guidelineRef:{evidence_type:"指南",doc_id:"4569a34f-9f0f-44e5-8b93-5f298ef949e7",split_index:9,type:"guideline",authority:"中华医学会外科学分会腹腔镜与内镜外科学组，中国抗癌协会胃癌专业委员会，中国抗癌协会腔镜与机器人外科分会，《中华消化外科杂志》编辑委员会",source_title:"精准外科胃癌转化治疗专家共识（2025 版）",source_version:"2025",source_section:"",source_url:"",evidence_summary:"推荐意见 2：对于初诊评估为 cⅣ期胃癌患者，经过 MDT 讨论，认为经综合治疗后有可能实施根治性手术切除者，可实施转化治疗。"}},{id:"Q4",type:"不良反应管理",phase:"不良反应处理",timepoint:"出现 G4 ICI 相关 1 型糖尿病并 DKA 时",question:"患者出现 G4 免疫检查点抑制剂相关 1 型糖尿病并糖尿病酮症酸中毒，血糖>27.8mmol/L，酮体阳性。按当前指南进行教学复盘，此时最恰当的处理是？",options:["暂停免疫检查点抑制剂治疗，住院治疗，请内分泌科会诊，起始胰岛素治疗并按 DKA 管理","暂停免疫治疗，口服降糖药控制血糖","继续免疫治疗，同时使用胰岛素","暂停免疫治疗，使用大剂量糖皮质激素治疗糖尿病"],answer:0,answer_text:"暂停免疫检查点抑制剂治疗，住院治疗，请内分泌科会诊，起始胰岛素治疗并按 DKA 管理",explain:"患者出现严重高血糖或 DKA 时应住院，免疫检查点抑制剂应暂停直至 DKA 解决，并起始胰岛素治疗。G4 DKA 需胰岛素而非口服降糖药；G4 毒性需暂停 ICI 而非继续。",keyPoint:"G4 ICI 相关高血糖并 DKA 需暂停 ICI、住院、内分泌会诊、起始胰岛素治疗并按 DKA 规范管理。",guidelineRef:{evidence_type:"指南",doc_id:"e14f6ad5-719e-496a-b21e-3fa3e293a209",split_index:57,type:"guideline",authority:"SITC",source_title:"Society for Immunotherapy of Cancer (SITC) clinical practice guideline on immune checkpoint inhibitor-related adverse events",source_version:"2021",source_section:"",source_url:"",evidence_summary:"Patients with new-onset diabetes (type I) should be tested for hemoglobin A1c, C-peptide, autoantibodies and counseled on diabetes management, including diet and lifestyle changes, glucose monitoring, and insulin treatment. If patients experience severe hyperglycemia or DKA on ICIs, they should be hospitalized. Patients with hyperglycemia should be evaluated for DKA and ICIs should be held until DKA is resolved."}},{id:"Q5",type:"不良反应管理",phase:"不良反应处理",timepoint:"依据当前 2026 版共识进行教学复盘：出现 G3 ICI 相关间质性肺炎，感染不能排除时",question:"患者出现 G3 免疫检查点抑制剂相关间质性肺炎，伴高热和低氧。支气管肺泡灌洗液涂片曾见革兰阴性杆菌，感染不能排除。此时最恰当的处理是？",options:["暂停免疫检查点抑制剂，加强监护，给予甲泼尼龙 500-1000mg/d，同步完善抗感染与并发症处置，由 MDT 共同决策","暂停免疫治疗，给予甲泼尼龙治疗，无需抗感染","继续免疫治疗，同时给予抗感染和激素治疗","永久停用免疫检查点抑制剂，无需激素治疗"],answer:0,answer_text:"暂停免疫检查点抑制剂，加强监护，给予甲泼尼龙 500-1000mg/d，同步完善抗感染与并发症处置，由 MDT 共同决策",explain:"评估为 G3 免疫相关性肺炎时，需暂停 ICI 并加强监护，甲强龙 500~1000mg/d，并同步完善抗感染与并发症处置；整个过程建议由外科、肿瘤内科、呼吸科与影像等 MDT 共同决策，既避免将免疫毒性误判为感染而延误激素治疗，也避免在活动性感染未排除时过早使用免疫抑制剂。本病例感染不能排除，需同时考虑常规感染和免疫相关性肺炎两种可能，积极进行鉴别诊断和并行处理。",keyPoint:"G3 ICI 相关肺炎需暂停 ICI、激素治疗、同步抗感染与并发症处置，感染不能排除时需并行鉴别和处理，由 MDT 共同决策。",guidelineRef:{evidence_type:"指南",doc_id:"2b5b1e25-7a79-4a0e-8e67-c7ae2c3eaf45",split_index:44,type:"guideline",authority:"CACA",source_title:"消化道肿瘤围手术期免疫治疗相关不良事件管理专家共识（2026 版）",source_version:"2026",source_section:"",source_url:"",evidence_summary:"评估为 G3 免疫相关性肺炎时，需暂停 ICI 并加强监护，甲强龙 500~1000mg/d，并同步完善抗感染与并发症处置；整个过程建议由外科、肿瘤内科、呼吸科与影像等 MDT 共同决策，既避免将免疫毒性误判为感染而延误激素治疗，也避免在活动性感染未排除时过早使用免疫抑制剂。"}}],Fs={generation_status:Xs,question_count:Ks,difficulty:ws,questions:Js},$s="success",Ws=5,ks="进阶",Is=[{id:"Q1",type:"治疗决策",phase:"初始治疗",timepoint:"2020 年初诊时",question:"患者确诊 ROS1 融合阳性 IVB 期肺腺癌，伴脑转移，ECOG PS 1 分。综合当前规范，此时最适宜的初始系统治疗策略是？",options:["含铂双药化疗联合贝伐珠单抗","免疫检查点抑制剂联合化疗","ROS1 酪氨酸激酶抑制剂（如克唑替尼）","全脑放疗联合最佳支持治疗"],answer:2,answer_text:"ROS1 酪氨酸激酶抑制剂（如克唑替尼）",explain:"根据 CSCO 非小细胞肺癌诊疗指南 2026，目前 ROS1 融合基因阳性 IV 期 NSCLC 一线治疗 I 级推荐应用克唑替尼，含铂双药化疗±贝伐珠单抗可作为 ROS1 融合阳性非鳞癌患者一线治疗的Ⅱ级推荐。",keyPoint:"ROS1 融合阳性 IV 期 NSCLC 一线治疗 I 级推荐应用克唑替尼。",guidelineRef:{evidence_type:"指南",doc_id:"065ff4dc-ec1b-442e-8381-e8d820673576",split_index:196,type:"guideline",authority:"CSCO",source_title:"中国临床肿瘤学会（CSCO）非小细胞肺癌诊疗指南 2026",source_version:"2026",source_section:"【注释】",source_url:"",evidence_summary:"目前 ROS1 融合基因阳性 IV 期 NSCLC 一线治疗 I 级推荐应用克唑替尼，含铂双药化疗±贝伐珠单抗可作为 ROS1 融合阳性非鳞癌患者一线治疗的Ⅱ级推荐。"}},{id:"Q2",type:"治疗决策",phase:"疾病进展管理",timepoint:"2021 年 9 月 CNS 进展时",question:"患者在 ROS1 靶向治疗期间出现 CNS 进展，颅外病灶仍相对稳定。下列哪项属于当前正式指南明确列出的 CNS 进展管理路径？",options:["立即停用靶向药，更换为含铂双药化疗","克唑替尼或克唑替尼联合局部治疗","单纯增加原靶向药物剂量","暂停所有抗肿瘤治疗，仅行最佳支持治疗"],answer:1,answer_text:"克唑替尼或克唑替尼联合局部治疗",explain:"根据肺癌中西医结合诊疗指南 2024，ROS1 融合 NSCLC 二线治疗中，对于 CNS 进展，Ⅰ级推荐克唑替尼或克唑替尼 + 局部治疗（限 CNS/寡进展）。",keyPoint:"ROS1 融合 NSCLC 发生 CNS 进展时，指南列出克唑替尼或克唑替尼联合局部治疗。",guidelineRef:{evidence_type:"指南",doc_id:"c2dca4fe-a78d-4265-a981-75684823baad",split_index:77,type:"guideline",authority:"中国中西医结合学会",source_title:"肺癌中西医结合诊疗指南",source_version:"2024",source_section:"表 10ROS1 融合 NSCLC 治疗推荐",source_url:"",evidence_summary:"ROS1 融合 NSCLC 二线治疗，寡进展或 CNS 进展：Ⅰ级推荐克唑替尼或克唑替尼 + 局部治疗（限 CNS/寡进展）。"}},{id:"Q3",type:"治疗决策",phase:"后线系统治疗",timepoint:"2022 年 8 月广泛进展时",question:"患者经多线 TKI 治疗后出现脑部及肺部广泛进展，再次活检暂不可行且后续 ROS1 抑制剂可及性受限。此时最适宜的系统治疗方案是？",options:["单药免疫治疗","含铂双药化疗联合或不联合贝伐珠单抗","继续原 TKI 治疗","单纯局部放疗"],answer:1,answer_text:"含铂双药化疗联合或不联合贝伐珠单抗",explain:"根据 CACA 肺癌指南 2024，ROS1 阳性一线治疗后广泛进展，推荐含铂双药化疗 + 局部治疗或含铂双药化疗 + 贝伐珠单抗（非鳞癌）。在 TKI 耐药且无其他靶向药可用时，含铂双药化疗±贝伐珠单抗是标准后线选择。",keyPoint:"TKI 耐药广泛进展后，含铂化疗±贝伐珠单抗是标准后线治疗。",guidelineRef:{evidence_type:"指南",doc_id:"fd357ad4-e149-4a6f-b624-009a1351acad",split_index:77,type:"guideline",authority:"CACA",source_title:"肺癌",source_version:"2024",source_section:"2 晚期 LC 内科治疗",source_url:"",evidence_summary:"ROS1 阳性后线治疗：一线治疗后广泛进展，推荐含铂双药化疗 + 局部治疗或含铂双药化疗 + 贝伐珠单抗（非鳞癌）。"}},{id:"Q4",type:"诊断策略",phase:"分子检测与耐药评估",timepoint:"2023 年 8 月再次进展时",question:"患者化疗后再次进展，拟重新评估分子状态以指导后续治疗。关于 ROS1 融合基因检测策略，下列说法正确的是？",options:["IHC 检测是 ROS1 融合确诊的金标准，无需其他验证","仅推荐进行血液 NGS 检测，无需组织活检","推荐采用 FISH、qRT-PCR 或 NGS 方法进行检测","ROS1 融合发生率极低，无需常规检测"],answer:2,answer_text:"推荐采用 FISH、qRT-PCR 或 NGS 方法进行检测",explain:"根据 CACA 肺癌指南 2024，ROS1 融合基因检测方法包括 FISH、qRT-PCR 和 NGS 方法。其中 qRT-PCR 和 NGS 法获 NMPA 注册证用于肿瘤组织 ROS1 融合基因检测。IHC 仅用于初筛，阳性需验证。ROS1 融合发生率 1%-2%，需规范检测。",keyPoint:"ROS1 融合检测推荐 FISH、qRT-PCR 或 NGS，IHC 仅用于初筛。",guidelineRef:{evidence_type:"指南",doc_id:"fd357ad4-e149-4a6f-b624-009a1351acad",split_index:23,type:"guideline",authority:"CACA",source_title:"肺
